name: Validate OpenAPI Specs

on:
  push:
    branches: [main]
    paths:
      - 'openapi/**'
  pull_request:
    branches: [main]
    paths:
      - 'openapi/**'

jobs:
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Lint specs (YAML)
        run: |
          redocly lint \
            openapi/data-api.yaml \
            openapi/project-api.yaml \
            openapi/local-marketing-api.yaml \
            openapi/se-visible-api.yaml

      - name: Validate JSON matches YAML
        run: |
          npm install --no-save js-yaml
          node -e "
            const fs = require('fs');
            const yaml = require('js-yaml');
            let failed = false;
            for (const name of ['data-api', 'project-api', 'local-marketing-api', 'se-visible-api']) {
              const yamlSpec = yaml.load(fs.readFileSync('openapi/' + name + '.yaml', 'utf8'));
              const jsonSpec = JSON.parse(fs.readFileSync('openapi/' + name + '.json', 'utf8'));
              const yamlStr = JSON.stringify(yamlSpec, null, 2);
              const jsonStr = JSON.stringify(jsonSpec, null, 2);
              if (yamlStr !== jsonStr) {
                console.error('ERROR: ' + name + ' JSON and YAML specs are out of sync');
                failed = true;
              } else {
                console.log(name + ': JSON and YAML specs are in sync');
              }
            }
            if (failed) process.exit(1);
          "
