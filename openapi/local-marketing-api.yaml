openapi: 3.0.3
info:
  title: SE Ranking Local Marketing API
  version: 1.0.0
  description: >-
    **Local Marketing API** provides read-only endpoints to retrieve Local Marketing data for locations added to your
    account: location profiles and statistics, Google Business Profile reports, reviews, business listings (citations),
    local rankings, and audit reports.


    Using the Local Marketing API, you can:


    - list your Local Marketing locations with key statistics, and read a location’s full business profile


    - pull a combined reporting overview for a location in a single request


    - track local rankings by keyword and tracking point, including the indexed percent


    - read Local Marketing audit reports and their history


    ## Authentication


    All endpoints are served from `https://api.seranking.com` and use one SE Ranking API key, the same key for the Data
    API, the Project API, the Local Marketing API and the SE Visible API. Send it in the `Authorization: Token
    YOUR_API_KEY` header (recommended) or as the `apikey` query parameter. See [Getting API
    access](https://seranking.com/api/how-to-get-api/).


    Rate limits: [API rate limits](https://seranking.com/api/rate-limits/). Credits: [API credit
    system](https://seranking.com/api/api-credits-system/).
  contact:
    name: SE Ranking API Support
    url: https://seranking.com/api/
    email: api@seranking.com
  license:
    name: MIT
    url: https://github.com/seranking/openapi/blob/main/LICENSE
externalDocs:
  description: SE Ranking Local Marketing API documentation
  url: https://seranking.com/api/local-marketing-api/
servers:
  - url: https://api.seranking.com
    description: Production
security:
  - tokenAuth: []
  - apikeyQuery: []
tags:
  - name: Locations
    description: >-
      **Locations API** provides endpoints to list Local Marketing locations available in your account and retrieve
      detailed information about a single location.


      Documentation: [Locations](https://seranking.com/api/local-marketing-api/locations/)
  - name: Location Overview
    description: >-
      **Location overview API** returns a combined reporting overview for a location in a single request: location
      details, Google Business Profile metrics and searches, reviews overview, business listings overview, the latest
      audit report, and a rankings summary.


      Documentation: [Location overview](https://seranking.com/api/local-marketing-api/location-overview/)
  - name: Local Rankings
    description: >-
      **Local Rankings API** provides endpoints to retrieve tracked keywords, position history by tracking point, and
      the indexed percent for a location.


      Documentation: [Local Rankings](https://seranking.com/api/local-marketing-api/local-rankings/)
  - name: Google Business Profile
    description: >-
      **Google Business Profile API** provides endpoints to retrieve GBP performance metrics, the keyword report, and
      the searches trend for a location.


      Documentation: [Google Business Profile](https://seranking.com/api/local-marketing-api/google-business-profile/)
  - name: Business Listings
    description: >-
      **Business Listings API** provides endpoints to list business listings for a location across connected directories
      and retrieve aggregated listing statistics. Note: endpoint paths use `citations`, the API term for directory
      listings.


      Documentation: [Business Listings](https://seranking.com/api/local-marketing-api/business-listings/)
  - name: Reviews
    description: >-
      **Reviews API** provides endpoints to list reviews for a location across connected review sources and retrieve
      aggregated review statistics.


      Documentation: [Reviews](https://seranking.com/api/local-marketing-api/reviews/)
  - name: Local Marketing Audit
    description: >-
      **Local Marketing Audit API** provides endpoints to retrieve the latest audit report and the audit report history
      for a location.


      Documentation: [Local Marketing Audit](https://seranking.com/api/local-marketing-api/local-marketing-audit/)
paths:
  /v1/local-marketing/locations:
    get:
      operationId: listLocations
      tags:
        - Locations
      summary: List locations
      description: >-
        Returns a list of Local Marketing locations accessible to the authenticated user, with key statistics for each
        location.


        If successful, the server returns the `200` HTTP status code, an array of locations in `items`, and a
        `pagination` object.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/local-marketing-api/locations/#list-locations
      parameters:
        - name: ids
          in: query
          description: Filter by a comma-separated list of location IDs, e.g. `15,18,21`.
          schema:
            type: string
        - name: with_demo
          in: query
          description: >-
            Include demo locations. Default is `false`. Accounts with only demo locations receive an empty list unless
            this is set to `true`.
          schema:
            type: boolean
        - name: is_active
          in: query
          description: Filter by active status.
          schema:
            type: boolean
        - name: search
          in: query
          description: Search by location title or profile fields.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of items to return (1–1000). Default is `100`.
          schema:
            type: integer
        - name: offset
          in: query
          description: Number of items to skip. Default is `0`.
          schema:
            type: integer
        - name: sort
          in: query
          description: Field to sort by.
          schema:
            type: string
        - name: sort_order
          in: query
          description: "Sorting order: `asc` or `desc`. Default is `desc`."
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Location ID.
                        account_id:
                          type: integer
                          description: Owning account ID.
                        account_name:
                          type: string
                          description: Owning account name (can be `null`).
                        title:
                          type: string
                          description: Location title.
                        lang:
                          type: string
                          description: Location language.
                        is_active:
                          type: boolean
                          description: Whether the location is active.
                        is_demo:
                          type: boolean
                          description: Whether the location is a demo.
                        is_sub:
                          type: boolean
                          description: Whether the location belongs to a sub-account (can be `null`).
                        is_shared:
                          type: boolean
                          description: Whether the location is shared (can be `null`).
                        created_at:
                          type: string
                          description: Creation timestamp (can be `null`).
                        updated_at:
                          type: string
                          description: Last update timestamp (can be `null`).
                        connection_status:
                          type: string
                          description: Connection lifecycle status for the location in Local Marketing (can be `null`).
                        sync_status:
                          type: string
                          description: Current synchronization status across connected directories (can be `null`).
                        last_synced_at:
                          type: string
                          description: Last synchronization timestamp (can be `null`).
                        statistics:
                          type: object
                          properties:
                            reviews_count:
                              type: integer
                              description: Total number of reviews (can be `null`).
                            average_rating:
                              type: number
                              description: >-
                                Average review rating. Note: computed differently from `average_rating` in [Get reviews
                                overview](https://seranking.com/api/local-marketing-api/reviews/#get-reviews-overview) —
                                the two values are distinct metrics and may not match (can be `null`).
                            unanswered_reviews_count:
                              type: integer
                              description: Reviews awaiting a reply (can be `null`).
                            listings_count:
                              type: integer
                              description: Number of business listings (can be `null`).
                            citations_score:
                              type: number
                              description: Citations score, 0–100 (can be `null`).
                            citations_percentile:
                              type: integer
                              description: Citations score percentile. Distinct from `citations_score` (can be `null`).
                            listed_directories_count:
                              type: integer
                              description: Directories where the location is listed (can be `null`).
                            synced_directories_count:
                              type: integer
                              description: >-
                                Directories currently synchronized. A listing can be listed but not yet synced (can be
                                `null`).
                            mismatched_directories_count:
                              type: integer
                              description: Directories with mismatched listing data (can be `null`).
                            keywords_count:
                              type: integer
                              description: >-
                                Tracked keywords. Note: counts keywords, while
                                `top_3_keywords_count`/`top_10_keywords_count` count keyword × tracking-point pairs, so
                                TOP-N values can exceed `keywords_count` (can be `null`).
                            average_position:
                              type: number
                              description: Average local ranking position (can be `null`).
                            top_3_keywords_count:
                              type: integer
                              description: Keywords ranking in the top 3 (can be `null`).
                            top_10_keywords_count:
                              type: integer
                              description: Keywords ranking in the top 10 (can be `null`).
                            audit_score_percent:
                              type: integer
                              description: Latest audit score, in percent (can be `null`).
                          description: Key statistics for the location.
                      description: List of locations.
                    description: List of locations.
                  pagination:
                    type: object
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                    description: "Pagination info: `total`, `limit`, `offset`."
              example:
                items:
                  - id: 15
                    account_id: 42
                    account_name: Acme Agency
                    title: Folk Osteria
                    lang: en
                    is_active: true
                    is_demo: false
                    is_sub: false
                    is_shared: false
                    created_at: "2026-04-10 09:15:00"
                    updated_at: "2026-08-04 12:00:00"
                    connection_status: connected
                    sync_status: synced
                    last_synced_at: "2026-08-04 12:00:00"
                    statistics:
                      reviews_count: 60
                      average_rating: 3.8
                      unanswered_reviews_count: 8
                      listings_count: 57
                      citations_score: 85
                      citations_percentile: 78
                      listed_directories_count: 66
                      synced_directories_count: 49
                      mismatched_directories_count: 3
                      keywords_count: 355
                      average_position: 10.97
                      top_3_keywords_count: 49
                      top_10_keywords_count: 167
                      audit_score_percent: 85
                pagination:
                  total: 2
                  limit: 100
                  offset: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |-
            curl -X GET 'https://api.seranking.com/v1/local-marketing/locations?is_active=true&limit=100&offset=0' \
              -H 'Authorization: Token YOUR_API_KEY'
  /v1/local-marketing/locations/{location_id}:
    get:
      operationId: getLocationDetails
      tags:
        - Locations
      summary: Get location details
      description: >-
        Returns detailed information about a single location: its business profile, owner, permissions, Google
        connection state, and latest audit score.


        If successful, the server returns the `200` HTTP status code and a location details object. Returns HTTP `404`
        if the location is not found.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/local-marketing-api/locations/#get-location-details
      parameters:
        - name: location_id
          in: path
          required: true
          description: Location ID (path parameter).
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  account_id:
                    type: integer
                  account_name:
                    type: string
                  title:
                    type: string
                  lang:
                    type: string
                  is_active:
                    type: boolean
                  is_demo:
                    type: boolean
                  created_at:
                    type: string
                  updated_at:
                    type: string
                  connection_status:
                    type: string
                  sync_status:
                    type: string
                  last_synced_at:
                    type: string
                  statistics:
                    type: object
                    properties:
                      reviews_count:
                        type: integer
                      average_rating:
                        type: number
                      listings_count:
                        type: integer
                      citations_score:
                        type: number
                      audit_score_percent:
                        type: integer
                  profile:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Business name.
                      primary_phone:
                        type: string
                        description: Primary phone number (can be `null`).
                      additional_phones:
                        type: array
                        items:
                          description: Additional phone numbers.
                        description: Additional phone numbers.
                      website:
                        type: string
                        description: Website URL (can be `null`).
                      description:
                        type: string
                        description: Business description (can be `null`).
                      address:
                        type: object
                        properties:
                          postal_code:
                            type: string
                          region_code:
                            type: string
                          region_display_name:
                            type: string
                          administrative_area:
                            type: string
                          locality:
                            type: string
                          address_lines:
                            type: array
                            items:
                              type: string
                        description: >-
                          Address: `postal_code`, `region_code`, `region_display_name`, `administrative_area`,
                          `locality`, `address_lines`.
                      primary_category:
                        type: object
                        properties:
                          id:
                            type: string
                          display_name:
                            type: string
                        description: "Primary business category: `id`, `display_name`."
                      additional_categories:
                        type: array
                        items:
                          description: Additional business categories.
                        description: Additional business categories.
                      working_hours:
                        type: object
                        properties: {}
                        description: Working hours.
                      service_area:
                        type: object
                        properties: {}
                        description: Service area settings.
                      social_profiles:
                        type: array
                        items:
                          type: object
                          properties:
                            network:
                              type: string
                            url:
                              type: string
                          description: Social profiles, each with `network` and `url`.
                        description: Social profiles, each with `network` and `url`.
                    description: Business profile of the location.
                  properties:
                    type: object
                    properties: {}
                    description: >-
                      Additional location properties. Note: currently returned as an object when populated but as an
                      empty array `[]` when empty — typed clients should handle both.
                  owner:
                    type: object
                    properties:
                      id:
                        type: integer
                      parent_id: {}
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      lang:
                        type: string
                    description: "Location owner: `id`, `parent_id`, `email`, `first_name`, `last_name`, `lang`."
                  permissions:
                    type: array
                    items:
                      type: string
                      description: Permissions the current user has for this location.
                    description: Permissions the current user has for this location.
                  auth:
                    type: object
                    properties:
                      google_connection_status:
                        type: string
                        description: Google connection status (can be `null`).
                      requires_reconnect:
                        type: boolean
                        description: Whether the Google account needs to be reconnected (can be `null`).
                      connected_at:
                        type: string
                        description: Connection timestamp (can be `null`).
                    description: Google connection state.
                  audit:
                    type: object
                    properties:
                      score_percent:
                        type: integer
                        description: Latest audit score, in percent (can be `null`).
                    description: Audit summary.
              example:
                id: 15
                account_id: 42
                account_name: Acme Agency
                title: Folk Osteria
                lang: en
                is_active: true
                is_demo: false
                created_at: "2026-04-10 09:15:00"
                updated_at: "2026-08-04 12:00:00"
                connection_status: connected
                sync_status: synced
                last_synced_at: "2026-08-04 12:00:00"
                statistics:
                  reviews_count: 60
                  average_rating: 3.8
                  listings_count: 57
                  citations_score: 85
                  audit_score_percent: 85
                profile:
                  name: Folk Osteria
                  primary_phone: 1 801-843-9517
                  additional_phones: []
                  website: https://folkosteria.com
                  description: Italian restaurant in Holladay.
                  address:
                    postal_code: "84117"
                    region_code: US
                    region_display_name: United States
                    administrative_area: UT
                    locality: Holladay
                    address_lines:
                      - Highland Dr.
                  primary_category:
                    id: gcid:italian_restaurant
                    display_name: Italian restaurant
                  additional_categories: []
                  working_hours: {}
                  service_area: {}
                  social_profiles:
                    - network: facebook
                      url: https://facebook.com/folkosteria
                properties: {}
                owner:
                  id: 7
                  parent_id: null
                  email: owner@acme.agency
                  first_name: Jane
                  last_name: Doe
                  lang: en
                permissions:
                  - view
                  - export
                auth:
                  google_connection_status: connected
                  requires_reconnect: false
                  connected_at: "2026-04-10 09:20:00"
                audit:
                  score_percent: 85
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |-
            curl -X GET 'https://api.seranking.com/v1/local-marketing/locations/15' \
              -H 'Authorization: Token YOUR_API_KEY'
  /v1/local-marketing/locations/{location_id}/overview:
    get:
      operationId: getLocationOverview
      tags:
        - Location Overview
      summary: Get location overview
      description: >-
        Returns a combined reporting overview for a location in a single request: location details, Google Business
        Profile metrics and searches, reviews overview, citations overview, the latest audit report, and rankings
        summary.


        If successful, the server returns the `200` HTTP status code and a combined overview object. Returns HTTP `404`
        if the location is not found.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/local-marketing-api/location-overview/#get-location-overview
      parameters:
        - name: location_id
          in: path
          required: true
          description: Location ID (path parameter).
          schema:
            type: integer
        - name: from
          in: query
          description: Start date (in `YYYY-MM-DD`).
          schema:
            type: string
        - name: to
          in: query
          description: End date (in `YYYY-MM-DD`).
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  location:
                    type: object
                    properties:
                      id:
                        type: integer
                      account_id:
                        type: integer
                      title:
                        type: string
                      lang:
                        type: string
                      is_active:
                        type: boolean
                      is_demo:
                        type: boolean
                      statistics:
                        type: object
                        properties:
                          reviews_count:
                            type: integer
                          average_rating:
                            type: number
                          audit_score_percent:
                            type: integer
                    description: >-
                      Location snapshot. Note: this block is its own projection and differs from [Get location
                      details](https://seranking.com/api/local-marketing-api/locations/#get-location-details) in several
                      fields — hours are returned as `regular_hours`/`special_hours`/`more_hours` (not
                      `profile.working_hours`), coordinates come in `latlng`, there is no `auth` block, the `statistics`
                      key set differs, and extra fields such as `attributes`, `owner.type`, and `is_claimed_by_others`
                      appear.
                  gbp_metrics:
                    type: object
                    properties:
                      location_id:
                        type: integer
                      from:
                        type: string
                      to:
                        type: string
                      group_by:
                        type: string
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            date:
                              type: string
                            metrics:
                              type: object
                              properties:
                                business_impressions_desktop_maps:
                                  type: integer
                                business_impressions_desktop_search:
                                  type: integer
                                business_impressions_mobile_maps:
                                  type: integer
                                business_impressions_mobile_search:
                                  type: integer
                                business_direction_requests:
                                  type: integer
                                business_conversations:
                                  type: integer
                                call_clicks:
                                  type: integer
                                website_clicks:
                                  type: integer
                    description: >-
                      Google Business Profile metrics (see [Get Google Business Profile
                      metrics](https://seranking.com/api/local-marketing-api/google-business-profile/#get-google-business-profile-metrics)).
                  gbp_searches:
                    type: object
                    properties:
                      location_id:
                        type: integer
                      last_updated_date:
                        type: string
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            month:
                              type: string
                            direct:
                              type: integer
                            discovery:
                              type: integer
                            branded:
                              type: integer
                    description: >-
                      Google Business Profile searches trend (see [Get Google Business Profile searches
                      trend](https://seranking.com/api/local-marketing-api/google-business-profile/#get-google-business-profile-searches-trend)).
                  reviews_overview:
                    type: object
                    properties:
                      location_id:
                        type: integer
                      total_reviews:
                        type: integer
                      average_rating:
                        type: number
                      answered_reviews:
                        type: integer
                      unanswered_reviews:
                        type: integer
                    description: >-
                      Reviews overview (see [Get reviews
                      overview](https://seranking.com/api/local-marketing-api/reviews/#get-reviews-overview)).
                  citations_overview:
                    type: object
                    properties:
                      location_id:
                        type: integer
                      total_directories:
                        type: integer
                      active_directories:
                        type: integer
                      synced_directories:
                        type: integer
                    description: >-
                      Citations overview (see [Get business listings
                      overview](https://seranking.com/api/local-marketing-api/business-listings/#get-business-listings-overview)).
                  latest_audit_report:
                    type: object
                    properties:
                      id:
                        type: integer
                      location_id:
                        type: integer
                      created_at:
                        type: string
                      score_percent:
                        type: integer
                      issues:
                        type: array
                        items:
                          type: object
                          properties:
                            check_code:
                              type: string
                            category:
                              type: string
                            severity:
                              type: string
                            is_passed:
                              type: boolean
                            result_status:
                              type: string
                            issues_count:
                              type: integer
                            issues_count_prev:
                              type: integer
                            weight:
                              type: number
                            directories:
                              type: object
                              properties:
                                failed:
                                  type: array
                                  items:
                                    type: string
                                not_checked:
                                  type: array
                                  items: {}
                                new:
                                  type: array
                                  items: {}
                                fixed:
                                  type: array
                                  items:
                                    type: string
                    description: >-
                      The latest audit report: `id`, `location_id`, `created_at`, `score_percent`, and `issues` — the
                      full per-check list with the same fields as `entries` in [Get latest audit
                      report](https://seranking.com/api/local-marketing-api/local-marketing-audit/#get-latest-audit-report)
                      (`check_code`, `category`, `severity`, `result_status`, `issues_count`, `weight`, and the
                      `directories`/`reviews` drill-downs); only the envelope differs.
                  rankings:
                    type: object
                    properties:
                      keywords_tracked:
                        type: integer
                        description: Number of tracked keywords (can be `null`).
                      average_position:
                        type: number
                        description: Average keyword position (can be `null`).
                      top_3_keywords_count:
                        type: integer
                        description: Number of keywords in the TOP 3 (can be `null`).
                      top_10_keywords_count:
                        type: integer
                        description: Number of keywords in the TOP 10 (can be `null`).
                      indexed_percent:
                        type: number
                        description: Percentage of indexed keywords (can be `null`).
                    description: Rankings summary for the location.
              example:
                location:
                  id: 15
                  account_id: 42
                  title: Folk Osteria
                  lang: en
                  is_active: true
                  is_demo: false
                  statistics:
                    reviews_count: 60
                    average_rating: 3.8
                    audit_score_percent: 85
                gbp_metrics:
                  location_id: 15
                  from: "2026-05-01"
                  to: "2026-05-31"
                  group_by: DAY
                  items:
                    - date: "2026-05-01"
                      metrics:
                        business_impressions_desktop_maps: 46
                        business_impressions_desktop_search: 307
                        business_impressions_mobile_maps: 230
                        business_impressions_mobile_search: 50
                        business_direction_requests: 5
                        business_conversations: 2
                        call_clicks: 1
                        website_clicks: 21
                gbp_searches:
                  location_id: 15
                  last_updated_date: "2026-05-31"
                  items:
                    - month: "2026-05-01"
                      direct: 1200
                      discovery: 3400
                      branded: 800
                reviews_overview:
                  location_id: 15
                  total_reviews: 60
                  average_rating: 3.8
                  answered_reviews: 52
                  unanswered_reviews: 8
                citations_overview:
                  location_id: 15
                  total_directories: 66
                  active_directories: 57
                  synced_directories: 49
                latest_audit_report:
