  /v1/local-marketing/locations/{location_id}/reviews/overview:
    get:
      operationId: getReviewsOverview
      tags:
        - Reviews
      summary: Get reviews overview
      description: >-
        Returns aggregated review statistics for a location: totals, average rating, answered/unanswered counts, rating
        distribution, and a breakdown by source. When `from`/`to` are provided, aggregates are computed for that period;
        otherwise they cover the location’s entire history.


        If successful, the server returns the `200` HTTP status code and aggregated review statistics. Returns HTTP
        `404` if the location is not found.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/local-marketing-api/reviews/#get-reviews-overview
      parameters:
        - name: location_id
          in: path
          required: true
          description: Location ID (path parameter).
          schema:
            type: integer
        - name: from
          in: query
          description: Start date (in `YYYY-MM-DD`).
          schema:
            type: string
        - name: to
          in: query
          description: End date (in `YYYY-MM-DD`).
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  location_id:
                    type: integer
                    description: Location ID.
                  total_reviews:
                    type: integer
                    description: >-
                      Total number of reviews, **including unrated ones** — while `average_rating` and
                      `rating_distribution` cover rated reviews only, so `total_reviews` × `average_rating` does not
                      give a weighted total.
                  average_rating:
                    type: number
                    description: >-
                      Average rating across **rated** reviews only. A distinct metric from `statistics.average_rating`
                      in the location endpoints — the two may not match (can be `null`).
                  answered_reviews:
                    type: integer
                    description: Number of reviews with a reply.
                  unanswered_reviews:
                    type: integer
                    description: Number of reviews without a reply.
                  rating_distribution:
                    type: object
                    properties:
                      1_star:
                        type: integer
                      2_star:
                        type: integer
                      3_star:
                        type: integer
                      4_star:
                        type: integer
                      5_star:
                        type: integer
                    description: "Number of reviews per rating: `1_star` … `5_star`."
                  items_by_source:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                          description: Review source code.
                        reviews_count:
                          type: integer
                          description: Number of reviews from this source.
                        average_rating:
                          type: number
                          description: >-
                            Average rating across **rated** reviews only. A distinct metric from
                            `statistics.average_rating` in the location endpoints — the two may not match (can be
                            `null`).
                        answered_reviews:
                          type: integer
                          description: Number of reviews with a reply.
                        unanswered_reviews:
                          type: integer
                          description: Number of reviews without a reply.
                      description: Per-source breakdown.
                    description: Per-source breakdown.
              example:
                location_id: 15
                total_reviews: 60
                average_rating: 3.8
                answered_reviews: 52
                unanswered_reviews: 8
                rating_distribution:
                  1_star: 4
                  2_star: 5
                  3_star: 10
                  4_star: 21
                  5_star: 20
                items_by_source:
                  - source: google
                    reviews_count: 55
                    average_rating: 3.9
                    answered_reviews: 50
                    unanswered_reviews: 5
                  - source: facebook
                    reviews_count: 5
                    average_rating: 3.4
                    answered_reviews: 2
                    unanswered_reviews: 3
