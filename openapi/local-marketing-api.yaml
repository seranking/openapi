  /v1/local-marketing/locations/{location_id}/audit/reports/latest:
    get:
      operationId: getLatestAuditReport
      tags:
        - Local Marketing Audit
      summary: Get latest audit report
      description: >-
        Returns the latest Local Marketing audit report for a location. The response mirrors the report structure that
        drives the Local Marketing audit page: summary counters, per-check entries, previous issue counts, and optional
        directories/reviews payloads for checks with detailed drill-downs.


        If successful, the server returns the `200` HTTP status code and the audit report. Returns HTTP `404` if the
        location is not found.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/local-marketing-api/local-marketing-audit/#get-latest-audit-report
      parameters:
        - name: location_id
          in: path
          required: true
          description: Location ID (path parameter).
          schema:
            type: integer
        - name: date
          in: query
          description: Report date (in `YYYY-MM-DD`). If omitted, the latest finished report is returned.
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Report generation status (e.g. `finished`).
                  date:
                    type: string
                    description: Report date (in `YYYY-MM-DD`).
                  summary:
                    type: object
                    properties:
                      score:
                        type: integer
                        description: >-
                          Overall audit score, 0–100 — the same value exposed as `audit_score_percent`/`score_percent`
                          in the location endpoints (can be `null`).
                      total_errors:
                        type: integer
                        description: Total number of errors.
                      total_warnings:
                        type: integer
                        description: Total number of warnings.
                      total_notices:
                        type: integer
                        description: Total number of notices.
                    description: Summary counters.
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        check_code:
                          type: string
                          description: Stable audit check code used by frontend translations and navigation.
                        category:
                          type: string
                          description: Audit category used on the audit page (e.g. `profile`).
                        severity:
                          type: string
                          description: "Severity bucket: `error`, `warning`, or `notice`."
                        is_passed:
                          type: boolean
                          description: Deprecated compatibility field from the current frontend API.
                        result_status:
                          type: string
                          description: "Actual result status: `passed`, `failed`, or `undefined`."
                        issues_count:
                          type: integer
                          description: Number of issues found by the check (can be `null`).
                        issues_count_prev:
                          type: integer
                          description: Number of issues in the previous report (can be `null`).
                        weight:
                          type: number
                          description: Check weight in the overall score.
                        directories:
                          type: object
                          properties:
                            failed:
                              type: array
                              items:
                                type: string
                            not_checked:
                              type: array
                              items: {}
                            new:
                              type: array
                              items: {}
                            fixed:
                              type: array
                              items:
                                type: string
                          description: >-
                            Directory drill-down for directory checks: `failed`, `not_checked`, `new`, `fixed` (arrays
                            of directory codes).
                        reviews:
                          type: object
                          properties:
                            failed:
                              type: array
                              items:
                                type: string
                            new:
                              type: array
                              items:
                                type: string
                            fixed:
                              type: array
                              items: {}
                          description: "Review drill-down for review checks: `failed`, `new`, `fixed` (arrays)."
                      description: Per-check entries.
                    description: Per-check entries.
              example:
                status: finished
                date: "2026-05-30"
                summary:
                  score: 85
                  total_errors: 2
                  total_warnings: 5
                  total_notices: 3
                entries:
                  - check_code: nap_consistency
                    category: listings
                    severity: error
                    is_passed: false
                    result_status: failed
                    issues_count: 3
                    issues_count_prev: 5
                    weight: 2.5
                    directories:
                      failed:
                        - foursquare
                        - hotfrog
                      not_checked: []
                      new: []
                      fixed:
                        - yelp
                  - check_code: unanswered_reviews
                    category: reviews
                    severity: warning
                    is_passed: false
                    result_status: failed
                    issues_count: 8
                    issues_count_prev: 12
                    weight: 1
                    reviews:
                      failed:
                        - "501"
                        - "502"
                      new:
                        - "503"
                      fixed: []
