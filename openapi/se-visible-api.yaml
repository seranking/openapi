                            visibility_score:
                              type: object
                              properties:
                                values:
                                  type: array
                                  items:
                                    type: integer
                        "15":
                          type: object
                          properties:
                            visibility_score:
                              type: object
                              properties:
                                values:
                                  type: array
                                  items:
                                    type: integer
                        topic_id:
                          type: integer
                        visibility_score:
                          type: object
                          properties:
                            values:
                              type: array
                              items:
                                type: integer
                        brand_id:
                          type: integer
                        total_mentions:
                          type: object
