  /v1/se-visible/projects/{project_id}/sources:
    get:
      operationId: getProjectSources
      tags:
        - Sources
      summary: Get project sources
      description: >-
        Retrieves the sources (domains, subdomains, or URLs) that AI models cited across a project, with extensive
        filtering. The shape of each row in the response depends on `source_type`: `domain` returns one row per
        registrable domain (its subdomains are aggregated into the row), `subdomain` returns one row per host exactly as
        collected, and `url` returns one row per cited page.


        **Note:**


        - `source_type` switches the response between domain rows (`domain` and `subdomain`) and URL rows. It also
        changes which `source_sort_field` and `columns` values are valid: passing a value that belongs to the other type
        returns `422`.


        - Most numeric fields are wrapped in a metric object with a `values` array. A single period returns one entry in
        `values`. When you supply `date_range[1]` (compare mode), the field returns two entries plus a `delta` with
        `absolute` and `percentage`.


        - `source_type=domain` and `source_type=subdomain` — `ai_answers_count`, `pages`, `coverage`, `prompts_count`,
        `mention_rate`, `my_brand_mentions_count`, `competitors_count`, `first_seen`, `last_seen`, `dt`, `backlinks`,
        `referring_domains`, `domain_traffic`, and the delta variants `ai_answers_count_delta`, `pages_delta`,
        `coverage_delta`, `prompts_count_delta`, `mention_rate_delta`, `my_brand_mentions_count_delta`,
        `competitors_count_delta`, `responses_count_delta`.


        - `source_type=url` — `ai_answers_count`, `coverage`, `prompts_count`, `competitors_count`, `my_brand_mentions`,
        `gap_score`, `first_seen`, `last_seen`, `last_check_date`, `dt`, `traffic`, `domain_traffic`, and the delta
        variants `ai_answers_count_delta`, `prompts_count_delta`, `coverage_delta`, `responses_count_delta`.


        - The delta variants sort by the absolute change between periods (period 0 minus period 1) and require
        `date_range[1]`, otherwise the request is rejected with `422`. Rows with a `null` delta — for example when a
        strict-null metric such as `coverage` is missing in one period — are pushed to the end of the result in both
        ascending and descending order.


        - Rows with no value for `dt`, `traffic`, `domain_traffic`, `backlinks`, `referring_domains`, `gap_score`,
        `first_seen`, `last_seen`, or `last_check_date` also go to the end in both directions. Period metrics computed
        per request, such as `coverage`, keep the default order: nulls first ascending, last descending.


        - `source_type=domain` — `domain`, `domain_type`, `subdomains_count`, `pages`, `coverage`, `ai_answers_count`,
        `prompts_count`, `my_brand_mentions_count`, `mention_rate`, `brand_ids`, `domain_traffic`, `dt`, `backlinks`,
        `referring_domains`, `first_seen`, `last_seen`, `competitors_count`, `responses_count`.


        - `source_type=subdomain` — same as `domain`, minus `subdomains_count`.


        - `source_type=url` — `url`, `title`, `type`, `coverage`, `ai_answers_count`, `prompts_count`,
        `my_brand_mentions`, `gap_score`, `brand_ids`, `domain_traffic`, `dt`, `traffic`, `backlink_type`,
        `last_check_date`, `first_seen`, `last_seen`, `status`, `competitors_count`, `responses_count`.


        - The locked column (`domain` or `url`) is accepted but redundant — it is always returned regardless of the
        requested ids. An id outside the set allowed for the current `source_type` returns `422`.


        **Note:** `tracked_brand_ids` is no longer part of this endpoint’s contract. It was previously accepted but
        never applied, so removing it changes no response. If your integration passed it here, the data you received was
        unfiltered — please re-check it. To filter sources by brand, use `brand_ids` together with `brand_match_mode`.


        If successful, the server returns a sources object with the row list and a total count.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/se-visible/sources/#get-project-sources
      parameters:
        - name: project_id
          in: path
          required: true
          description: UUID of the project.
          schema:
            type: string
            format: uuid
        - name: date_range
          in: query
          required: true
          description: >-
            1 to 2 entries: base period at index `0`, optional compare period at index `1`. Each has `from` and `to` in
            `YYYY-MM-DD`. See [Date ranges and compare
            mode](https://seranking.com/api/se-visible/getting-started/#date-ranges-and-compare-mode).
          schema:
            type: array
            items:
              type: object
        - name: source_type
          in: query
          description: >-
            Row shape of the response: `domain` (one row per registrable domain, subdomains aggregated into it),
            `subdomain` (one row per host as collected), or `url` (one row per page). Also determines the valid set of
            `source_sort_field` and `columns` values.
          schema:
            type: string
            default: domain
        - name: model_types
          in: query
          description: Filter by AI model types (e.g. `chatgpt`).
          schema:
            type: array
            items:
              type: string
        - name: country_codes
          in: query
          description: >-
            **Deprecated — use `location_ids`.** Filter by ISO 3166-1 alpha-2 country codes. Resolved to the project’s
            live locations in those countries, so a deleted location is not matched, a country the project no longer
            tracks returns an empty result, and two locations in one country cannot be told apart. It keeps working for
            now; migrate to `location_ids` before it is withdrawn.
          schema:
            type: array
            items:
              type: string
        - name: location_ids
          in: query
          description: >-
            Filter by the project’s tracked locations, using location IDs from [List project
            locations](https://seranking.com/api/se-visible/locations/#list-project-locations). Multiple values combine
            as OR. An ID from another project or of a deleted location returns `422`. Combined with `country_codes`,
            only locations matching both are read. A row is attributed to the location its check collected it under, so
            a location added later has no earlier history.
          schema:
            type: array
            items:
              type: string
        - name: topic_ids
          in: query
          description: Filter by topic IDs.
          schema:
            type: array
            items:
              type: integer
        - name: prompt_ids
          in: query
          description: Filter by prompt IDs.
          schema:
            type: array
            items:
              type: integer
        - name: req_num
          in: query
          description: Limit to the answers with this request number within a check.
          schema:
            type: integer
        - name: sentiments
          in: query
          description: "Filter by sentiment: `positive`, `neutral`, `negative`."
          schema:
            type: array
            items:
              type: string
        - name: exclude_branded
          in: query
          description: >-
            When `true`, every number in the response is computed from non-branded prompts only, and branded prompts
            drop out. A prompt not yet classified counts as non-branded. Off when omitted.
          schema:
            type: boolean
        - name: search_query
          in: query
          description: Filter sources by a substring of the domain or URL.
          schema:
            type: string
        - name: domain_id
          in: query
          description: Restrict results to a single domain.
          schema:
            type: integer
        - name: types
          in: query
          description: >-
            Filter by URL category type (e.g. `blog`, `news`, `social`). See the
            [Reference](https://seranking.com/api/se-visible/reference/) for the full list.
          schema:
            type: array
            items:
              type: string
        - name: is_my_brand_mentions
          in: query
          description: >-
            Filter sources by whether the project’s primary brand is mentioned: `1` mentioned, `0` not mentioned, `-1`
            mention status not available.
          schema:
            type: integer
        - name: has_backlink
          in: query
          description: >-
            Filter source pages by `backlink_type`: `dofollow` (links to a brand domain and passes authority),
            `nofollow` (links to a brand domain without passing authority), `none` (checked, no link to a brand domain).
            Several values combine as OR. Pages not yet checked or that could not be read match none of the values; `-1`
            is not accepted. URL rows only: with `source_type=domain` (the default) it returns `422`.
          schema:
            type: array
            items:
              type: string
        - name: competitors_count_from
          in: query
          description: Minimum number of competitor brands on the source (inclusive, min `0`).
          schema:
            type: integer
        - name: competitors_count_to
          in: query
          description: Maximum number of competitor brands on the source (inclusive, min `0`).
          schema:
            type: integer
        - name: brand_ids
          in: query
          description: Keep sources that mention these brand IDs (see `brand_match_mode`).
          schema:
            type: array
            items:
              type: integer
        - name: brand_match_mode
          in: query
          description: When filtering by `brand_ids`, match `any` of the brands or `all` of them.
          schema:
            type: string
            default: any
        - name: domain_types
          in: query
          description: >-
            Filter rows by their domain type; several values combine as OR. Matches any element of the row’s
            `domain_type` array. Values: `you` (the primary brand’s own domain), `competitors` (a domain of another
            tracked brand), `corporate`, `ugc`, `editorial`, `reference`, `institutional` (stored base classification),
            `other` (neither a role nor a classification). `domain` and `subdomain` rows only: with `source_type=url` it
            returns `422`.
          schema:
            type: array
            items:
              type: string
        - name: columns
          in: query
          description: >-
            Column ids to return. When omitted, every column is returned. When provided, each row contains only these
            columns plus the always-present locked first column (`domain` or `url`), `domain_id`, which is used to drill
            down from a domain row to its URLs, and `url_id` on URL rows. Key order in the response is not guaranteed.
            The valid set depends on `source_type`; see the note below.


            Default: All columns
          schema:
            type: array
            items:
              type: string
        - name: source_sort_field
          in: query
          description: Field to sort by. The valid set depends on `source_type`; see the note below.
          schema:
            type: string
            default: ai_answers_count
        - name: sort_order
          in: query
          description: "Sort direction: `asc` or `desc`."
          schema:
            type: string
            default: desc
        - name: limit
          in: query
          description: Maximum number of sources to return (min `0`). `0` returns every row and ignores `offset`.
          schema:
            type: integer
            default: 1000
        - name: offset
          in: query
          description: Number of sources to skip from the start of the list (min `0`).
          schema:
            type: integer
            default: 0
