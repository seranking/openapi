  /v1/se-visible/projects/{project_id}/prompts:
    get:
      operationId: listPromptsOrTopics
      tags:
        - Prompts
      summary: List prompts or topics
      description: >-
        Returns a paginated list of the project’s prompts with their visibility metrics, or a list of topics with
        metrics aggregated across their prompts. The `group_mode` parameter controls which of the two shapes the
        response takes.


        **Note:**


        - `group_mode=prompt` (the default) returns individual prompts, one item per prompt.


        - `group_mode=topic` returns topics instead, with metrics aggregated across all prompts in each topic.


        - The response schema differs between the two modes. See both response examples below.


        **Note:** the `*_delta` sort variants sort by the absolute change between periods. They require `date_range[1]`
        to be present and to contain checks, otherwise the request is rejected with `422`. `id` sorts by prompt (or
        topic) ID. `rank` is accepted but currently falls back to the default `visibility` ordering. A prompt or topic
        without a `source_presence` or `organic_overlap` value in the period stays last in either direction, also under
        their `_delta` variants. `citations_count` and `citations_share` sort by the answers that cited the
        `cited_source` and require it, otherwise the request is rejected with `422`. `avg_position` and
        `avg_position_delta` run inverted: `desc` puts the best position, or the biggest improvement, first.


        **Note:** with `columns`, the response keeps the same shape but skips the work behind the columns you do not
        list: `competitors` (`tops` comes back empty), `organic_overlap` and `source_presence` (their metrics come back
        with a `null` value, unless you sort by that metric or its change). The `prompt` column and the base metrics
        (`mentions`, `avg_position`, `sentiments`, `visibility`, `sov`) are always computed. An unknown column ID is
        rejected with `422`.


        If successful, the server returns a paginated object. The shape of each item in `items` depends on `group_mode`.


        Each visibility metric (`mentions`, `avg_position`, `sentiments`, `visibility`, `sov`, `organic_overlap`,
        `source_presence`) is returned as a `MetricValue` object rather than a plain number.


        **Note:** value ranges — `sentiments` is `-100`–`100`; `visibility`, `sov`, `organic_overlap`, and
        `source_presence` are `0`–`100`; `mentions` is a raw count; `avg_position` is a float.


        **Example — group_mode=prompt (default)**


        One row per prompt. Row-specific fields: `id`, `topic_id`, `prompt`, `is_parsed`.


        **Example — group_mode=topic**


        One row per topic, metrics aggregated across the topic’s prompts. Row-specific fields: `id`, `title`,
        `prompts_count`, `branded_prompts_count` (replacing `topic_id`, `prompt`, `is_parsed`). The metric objects are
        identical to prompt mode.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/se-visible/prompts/#list-prompts-or-topics
      parameters:
        - name: project_id
          in: path
          required: true
          description: UUID of the project.
          schema:
            type: string
            format: uuid
        - name: group_mode
          in: query
          description: "What to list: `prompt` for individual prompts, `topic` for topics with aggregated metrics."
          schema:
            type: string
            default: prompt
        - name: date_range
          in: query
          required: true
          description: >-
            1 to 2 entries: base period at index `0`, optional compare period at index `1`. Each has `from` and `to` in
            `YYYY-MM-DD`. See [Date ranges and compare
            mode](https://seranking.com/api/se-visible/getting-started/#date-ranges-and-compare-mode).
          schema:
            type: array
            items:
              type: object
        - name: model_types
          in: query
          description: >-
            Filter by AI model types (e.g. `chatgpt`). See the
            [Reference](https://seranking.com/api/se-visible/reference/) for the full list.
          schema:
            type: array
            items:
              type: string
        - name: country_codes
          in: query
          description: >-
            **Deprecated — use `location_ids`.** Filter by ISO 3166-1 alpha-2 country codes, resolved to the project’s
            live locations in those countries. It still works for now; migrate to `location_ids` before it is withdrawn.
            See the [Reference](https://seranking.com/api/se-visible/reference/) for the full list.
          schema:
            type: array
            items:
              type: string
        - name: location_ids
          in: query
          description: >-
            Filter by the project’s tracked locations, using location IDs from [List project
            locations](https://seranking.com/api/se-visible/locations/#list-project-locations). Multiple values combine
            as OR. An ID of another project or of a deleted location is rejected with `422`. Combined with
            `country_codes`, only locations matching both are read.
          schema:
            type: array
            items:
              type: string
        - name: topic_ids
          in: query
          description: Filter by topic IDs.
          schema:
            type: array
            items:
              type: integer
        - name: search_query
          in: query
          description: Filter prompts by a search string.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of items to return. Minimum 0; `0` returns an empty page.
          schema:
            type: integer
            default: 1000
        - name: offset
          in: query
          description: Number of items to skip from the start of the list. Minimum 0.
          schema:
            type: integer
            default: 0
        - name: sort_field
          in: query
          description: >-
            Field to sort by: `id`, `visibility`, `avg_position`, `mentions`, `sentiments`, `sov`, `rank`,
            `visibility_delta`, `avg_position_delta`, `sentiments_delta`, `sov_delta`, `citations_count`,
            `citations_share`, `source_presence`, `source_presence_delta`, `organic_overlap`, `organic_overlap_delta`.
            See the note below.
          schema:
            type: string
            default: visibility
        - name: sort_order
          in: query
          description: "Sort direction: `asc` or `desc`."
          schema:
            type: string
            default: asc
        - name: sentiments
          in: query
          description: "Filter by sentiment: `positive`, `neutral`, `negative`."
          schema:
            type: array
            items:
              type: string
        - name: tracked_brand_ids
          in: query
          description: Filter by tracked brand IDs.
          schema:
            type: array
            items:
              type: integer
        - name: exclude_branded
          in: query
          description: >-
            When `true`, every number in the response is computed from non-branded prompts only, and branded prompts
            drop out of the list. A prompt not classified yet counts as non-branded. Off when omitted.
          schema:
            type: boolean
        - name: search_intents
          in: query
          description: >-
            Filter by search intent: `I` (informational), `L` (local), `N` (navigational), `C` (commercial), `T`
            (transactional). A prompt is returned when it carries any of the selected intents; prompts not classified
            yet are not returned while this filter is applied.
          schema:
            type: array
            items:
              type: string
        - name: funnel_stages
          in: query
          description: >-
            Filter by funnel stage: `awareness`, `consideration`, `decision`, `none`. A prompt is returned when it
            carries any of the selected stages. `none` matches only prompts explicitly marked as outside the funnel;
            prompts not classified yet are not returned while this filter is applied.
          schema:
            type: array
            items:
              type: string
        - name: lang_codes
          in: query
          description: >-
            Filter by the prompt’s language (ISO 639-1, e.g. `en`, `de`). See the
            [Reference](https://seranking.com/api/se-visible/reference/) for the full list. Prompts whose language is
            not detected yet are not returned while this filter is applied.
          schema:
            type: array
            items:
              type: string
        - name: columns
          in: query
          description: >-
            Columns to compute, for both `group_mode` values: `prompt`, `topic`, `visibility`, `sov`, `avg_position`,
            `competitors`, `sentiments`, `locations`, `source_presence`, `intent`, `funnel_stage`, `is_branded`,
            `organic_overlap`, `lang_code`. When omitted, every metric is computed. See the note below.
          schema:
            type: array
            items:
              type: string
        - name: cited_source[type]
          in: query
          description: >-
            Keep only the prompts whose answers cited one source row from [Get project
            sources](https://seranking.com/api/se-visible/sources/#get-project-sources) in the base period
            (`date_range[1]` is ignored for it): `url`, `domain`, or `subdomain`. `url` needs `cited_source[url_id]`;
            `domain` and `subdomain` need `cited_source[domain_id]`. Prompt list only: with `group_mode=topic` the
            request is rejected with `422`.
          schema:
            type: string
        - name: cited_source[url_id]
          in: query
          description: The `url_id` of the cited URL row. Minimum 1. Required with `cited_source[type]=url`, rejected otherwise.
          schema:
            type: integer
        - name: cited_source[domain_id]
          in: query
          description: >-
            Minimum 1. Required with `cited_source[type]=domain` or `subdomain`, rejected with `url`. For `subdomain` it
            is the row’s own `domain_id`; for `domain` it is the `domain_id` the domain row returns.
          schema:
            type: integer
        - name: metrics
          in: query
          description: >-
            Facts about the `cited_source` to add to each prompt as extra fields: `citations_count`, `citations_share`,
            `first_seen`, `last_seen`. Requires `cited_source`, otherwise the request is rejected with `422`.
          schema:
            type: array
            items:
              type: string
        - name: prompt_ids
          in: query
          description: >-
            Compute the metrics from the answers of these prompts only; the listed rows are not narrowed. Ignored when
            `search_query`, `exclude_branded`, `funnel_stages`, `search_intents`, or `lang_codes` is set.
          schema:
            type: array
            items:
              type: integer
        - name: req_num
          in: query
          description: >-
            Compute the metrics from the answers with this `request_number` only; the listed rows are not narrowed.
            Ignored when `search_query`, `exclude_branded`, `funnel_stages`, `search_intents`, or `lang_codes` is set.
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of prompts available.
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Prompt ID.
                        topic_id:
                          type: integer
                          description: ID of the topic the prompt belongs to.
                        prompt:
                          type: string
                          description: Prompt text.
                        locations:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Tracked location ID.
                              country_code:
                                type: string
                                description: Country code of the location (e.g. `US`).
                              geo_location_id:
                                nullable: true
                                description: Geo location ID of the city or region. `null` for country-level tracking.
                                type: integer
                            description: >-
                              Locations the prompt is currently tracked in, in creation order. Period and `model_types`
                              filters do not narrow it.
                          description: >-
                            Locations the prompt is currently tracked in, in creation order. Period and `model_types`
                            filters do not narrow it.
                        units:
                          type: integer
                          description: Number of current locations; equals the length of `locations`.
                        mentions:
                          type: object
                          properties:
                            values:
                              type: array
                              items:
                                type: integer
                                description: >-
                                  Metric values. One element per requested period: one value with no comparison, two
                                  values (base, compared) when a comparison period is supplied. Elements may be `null`
                                  when a period has no data.
