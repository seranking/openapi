  /v1/se-visible/projects/{project_id}/sources/metrics:
    get:
      operationId: getAggregatedSourceMetrics
      tags:
        - Sources
      summary: Get aggregated source metrics
      description: >-
        Returns aggregated source metrics for dynamic table and chart rendering — the sources equivalent of [Get
        aggregated brand metrics](https://seranking.com/api/se-visible/brands/#get-aggregated-brand-metrics). You choose
        how the data is grouped (`dimensions[]`) and which metrics to return (`metrics[]`).


        **Note:**


        - You pass 1 to 3 dimensions: at most one entity or type grain (`url`, `domain`, `subdomain`, `page_type`,
        `domain_type`), optionally `model_type` (the AI engine of the citing answers) beside it, and optionally one date
        dimension — `check_id` or `check_date` for one row per check, `check_week` or `check_month` for one row per
        calendar period (its checks aggregated, labelled by the period start). `model_type` on its own is also a grain.


        - With **1 dimension**, each row holds that dimension’s own columns plus one metric object per requested metric.


        - With **2 or 3 dimensions**, the response is a pivot: every dimension but the last keys the rows (in request
        order), and the **last** one becomes the columns. `meta.columns.dynamic` lists the remaining row dimension
        names, then the pivot column IDs, labelled by `meta.columns.labels`. Each cell is an object mapping every
        requested metric to its metric object.


        - Pivot rows are gap-filled with `0` cells: a date dimension returns every base check or period, `model_type`
        every engine the project runs; entities and types appear only when cited. A filled cell still carries the
        `responses_count` of its scope. `limit` and `offset` page the filled rows.


        - A pivot over an entity grain (`url`, `domain`, `subdomain`) requires `url_ids[]` or `domain_ids[]` and plots
        exactly those IDs — fetch the top rows first, then the pivot for those IDs. A pivot does not accept `filters` or
        `sort_field`, and a date dimension covers a single period: either returns `422`.


        - A date dimension on its own returns, per check, the period’s distinct AI answers that carry at least one brand
        mention, as rows with a single `ai_answers_count` cell. These are totals across all sources (per-source counts
        never sum to them, since one answer cites several sources). Only `ai_answers_count` is supported there, and
        `filters` require a grain.


        - Every metric value is an object, not a plain number: `{ "values": [v0] }` in single-period mode. Passing
        `date_range[1]` enables compare mode (requests without a date dimension only), which adds the second period and
        a `delta` object: `{ "values": [v0, v1], "delta": { "absolute": 15, "percentage": 50 } }`. Deltas are returned
        only in compare mode.


        - `subdomains_count` is valid only when the grain is `domain`, the only grain that folds subdomains into a
        domain row. With any other grain it returns `422`.


        If successful, the server returns a metrics object with pagination, column layout, and the data rows.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/se-visible/sources/#get-aggregated-source-metrics
      parameters:
        - name: project_id
          in: path
          required: true
          description: UUID of the project.
          schema:
            type: string
            format: uuid
        - name: dimensions[]
          in: query
          required: true
          description: >-
            1 to 3 dimensions, no duplicates. Two or more pivot by the last one, in request order. Values: `check_id`,
            `check_date`, `check_week`, `check_month`, `url`, `domain`, `subdomain`, `page_type`, `domain_type`,
            `model_type`.
          schema:
            type: array
            items:
              type: string
        - name: week_start
          in: query
          description: First weekday for a `check_week` dimension, from 0 to 6 (`0` Sunday, `6` Saturday).
          schema:
            type: integer
            default: 1
        - name: metrics[]
          in: query
          required: true
          description: >-
            At least one metric, each returned as a metric object. Values: `ai_answers_count`, `citations_share`,
            `prompts_count`, `my_brand_mentions_count`, `competitors_count`, `responses_count`, `subdomains_count`.
            `responses_count` is the number of answers in the row’s scope (its period or check, and its engine under a
            `model_type` split) that carry at least one brand mention, cited or not — the `citations_share` denominator.
            It is the same for every entity or type in that scope and is not additive across them.
          schema:
            type: array
            items:
              type: string
        - name: date_range
          in: query
          required: true
          description: >-
            1 to 2 entries: base period at index `0`, optional compare period at index `1`. Each has `from` and `to` in
            `YYYY-MM-DD`. Each period aggregates all checks within its dates. See [Date ranges and compare
            mode](https://seranking.com/api/se-visible/getting-started/#date-ranges-and-compare-mode).
          schema:
            type: array
            items:
              type: object
        - name: model_types
          in: query
          description: Filter by AI model types (e.g. `chatgpt`).
          schema:
            type: array
            items:
              type: string
        - name: country_codes
          in: query
          description: >-
            **Deprecated — use `location_ids`.** Filter by ISO 3166-1 alpha-2 country codes. Resolved to the project’s
            live locations in those countries, so a deleted location is not matched, a country the project no longer
            tracks returns an empty result, and two locations in one country cannot be told apart. It keeps working for
            now; migrate to `location_ids` before it is withdrawn.
          schema:
            type: array
            items:
              type: string
        - name: location_ids
          in: query
          description: >-
            Filter by the project’s tracked locations, using location IDs from [List project
            locations](https://seranking.com/api/se-visible/locations/#list-project-locations). Multiple values combine
            as OR. An ID from another project or of a deleted location returns `422`. Combined with `country_codes`,
            only locations matching both are read.
          schema:
            type: array
            items:
              type: string
        - name: topic_ids
          in: query
          description: Filter by topic IDs.
          schema:
            type: array
            items:
              type: integer
        - name: sentiments
          in: query
          description: "Filter by sentiment: `positive`, `neutral`, `negative`."
          schema:
            type: array
            items:
              type: string
        - name: exclude_branded
          in: query
          description: >-
            When `true`, every number in the response is computed from non-branded prompts only. A prompt not yet
            classified counts as non-branded. Off when omitted.
          schema:
            type: boolean
        - name: prompt_ids
          in: query
          description: Filter by prompt IDs.
          schema:
            type: array
            items:
              type: integer
        - name: req_num
          in: query
          description: Limit to the answers with this request number within a check.
          schema:
            type: integer
        - name: search_query
          in: query
          description: Search query for filtering results.
          schema:
            type: string
        - name: filters
          in: query
          description: >-
            Up to 10 post-aggregation metric conditions, combined with AND. Rows failing any condition are dropped, and
            `meta.pagination.total` reflects that. Each condition has `metric` (a `metrics[]` value), `target` (`0` base
            period value, `1` compare period value, or `delta` absolute change; `1` and `delta` require
            `date_range[1]`), `operator` (`gt`, `gte`, `eq`, `lt`, `lte`), and `value` (a number). All four are
            required. Example:
            `filters[0][metric]=ai_answers_count&filters[0][target]=delta&filters[0][operator]=gt&filters[0][value]=0`.
          schema:
            type: array
            items:
              type: object
        - name: url_ids[]
          in: query
          description: >-
            Up to 50 IDs. Narrow the sources the rows aggregate to these `url_id` values, whatever the grain. Required
            for a pivot over an entity grain, which plots exactly these IDs.
          schema:
            type: array
            items:
              type: integer
        - name: domain_ids[]
          in: query
          description: >-
            Up to 50 IDs. Narrow the sources to these `domain_id` values (as returned in the rows), whatever the grain.
            In the `subdomain` grain an ID selects exactly that subdomain; in the other grains a domain ID also matches
            every URL and subdomain under it.
          schema:
            type: array
            items:
              type: integer
        - name: types[]
          in: query
          description: >-
            Up to 50 values. Narrow the sources to these page types (e.g. `listicle`, `blog`, `news`), whatever the
            grain. See the [Reference](https://seranking.com/api/se-visible/reference/) for the full list.
          schema:
            type: array
            items:
              type: string
        - name: domain_types[]
          in: query
          description: >-
            Up to 50 values. Narrow the sources to these domain types (matches any element of a row’s `domain_type`
            array), whatever the grain: `you`, `competitors`, `corporate`, `ugc`, `editorial`, `reference`,
            `institutional`, `other`.
          schema:
            type: array
            items:
              type: string
        - name: sort_field
          in: query
          description: >-
            A requested metric name; sorts on period 0 values. Append `_delta` to sort by the absolute delta (e.g.
            `ai_answers_count_delta`), which requires `date_range[1]`, otherwise the request returns `422`.
          schema:
            type: string
            default: First metric, descending
        - name: sort_order
          in: query
          description: "Sort direction: `asc` or `desc`."
          schema:
            type: string
            default: desc
        - name: limit
          in: query
          description: >-
            Maximum rows to return, from 0 to 1000. `0` returns every row and requires two or more dimensions (`422`
            otherwise).
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          description: Number of rows to skip (min `0`).
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          total:
                            type: integer
                            description: "Total rows: the grain values, or the filled rows of a pivot."
                      columns:
                        type: object
                        properties:
                          primary:
                            type: string
                            description: First dimension the rows are keyed by (one of the `dimensions[]` values).
                          dynamic:
                            type: array
                            items:
                              type: string
                              description: >-
                                With 1 dimension, the requested metric names. In a pivot, the remaining row dimension
                                names, then the pivot column IDs (entity IDs, type values, or date labels, as strings).
                            description: >-
                              With 1 dimension, the requested metric names. In a pivot, the remaining row dimension
                              names, then the pivot column IDs (entity IDs, type values, or date labels, as strings).
                          labels:
                            type: object
                            properties:
                              "123":
                                type: string
                              "456":
                                type: string
                            description: >-
                              Pivot only. Maps each pivot column ID to its display label (URL or domain name, or the
                              value itself).
                    description: Pagination and column layout.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        "123":
                          type: object
                          properties:
                            ai_answers_count:
                              type: object
                              properties:
                                values:
                                  type: array
                                  items:
                                    type: integer
                            citations_share:
                              type: object
                              properties:
                                values:
                                  type: array
                                  items:
                                    type: number
                        "456":
                          type: object
                          properties:
                            ai_answers_count:
                              type: object
                              properties:
                                values:
                                  type: array
                                  items:
                                    type: integer
                            citations_share:
                              type: object
                              properties:
                                values:
                                  type: array
                                  items:
                                    type: number
                        domain_id:
                          type: integer
                        domain:
                          type: string
                        ai_answers_count:
                          type: object
                          properties:
                            values:
                              type: array
                              items:
                                type: integer
                            delta:
                              type: object
                              properties:
                                absolute:
                                  type: integer
                                percentage:
                                  type: integer
                        citations_share:
                          type: object
                          properties:
                            values:
                              type: array
                              items:
                                type: integer
                        check_date:
                          type: string
                      description: >-
                        Rows. With 1 dimension, each row is keyed by its own columns — `domain_id` and `domain` for the
                        `domain` and `subdomain` grains; `url_id`, `url`, and `domain_id` for `url`; `page_type`,
                        `domain_type`, or `model_type` for the type grains; the date label for a date dimension — plus
                        one metric object per requested metric. In a pivot, each row holds the row dimensions’ columns,
                        then one cell per pivot column keyed by its ID, mapping every requested metric to its metric
