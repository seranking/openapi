  /v1/se-visible/projects/{project_id}/brands/mentioned:
    get:
      operationId: listMentionedBrands
      tags:
        - Brands
      summary: List mentioned brands
      description: >-
        Returns all brands detected in the project’s AI check results. These are distinct from the brands you manually
        track, and are useful for discovering competitors to add. Without query parameters, the full list is returned.


        - Parameters are applied in this order: `search_query`, then `offset`, then `limit`.


        - The response is a flat array with no pagination envelope. The response to a request without parameters is
        unchanged.


        - An invalid `search_query`, `limit`, or `offset` returns `422`.


        If successful, the server returns a JSON array of mentioned brands.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/se-visible/brands/#list-mentioned-brands
      parameters:
        - name: project_id
          in: path
          required: true
          description: UUID of the project.
          schema:
            type: string
            format: uuid
        - name: search_query
          in: query
          description: Case-insensitive substring match on the brand title. Maximum 255 characters.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of brands to return. Minimum `1`. Omit to return the full list.
          schema:
            type: integer
        - name: offset
          in: query
          description: Number of brands to skip. Minimum `0`.
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    brand_id:
                      type: integer
                      description: Brand ID.
                    brand:
                      type: string
                      description: Brand name.
              example:
                - brand_id: 10
                  brand: Nike
                - brand_id: 11
                  brand: Adidas
