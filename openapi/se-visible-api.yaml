    delete:
      operationId: deletePrompts
      tags:
        - Prompts
      summary: Delete prompts
      description: >-
        Deletes one or more prompts from a project in a single request. Provide `prompt_ids` to delete individual
        prompts and/or `topic_ids` to delete all prompts of the given topics. At least one of the two must be supplied.


        If successful, the server returns `204 No Content` with an empty body.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/se-visible/prompts/#delete-prompts
      parameters:
        - name: project_id
          in: path
          required: true
          description: UUID of the project.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs of the prompts to delete.
                topic_ids:
                  type: array
                  items:
                    type: integer
                  description: IDs of topics whose prompts should all be deleted.
            example:
              prompt_ids:
                - 1
                - 2
      responses:
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
