            `sources_count` sort descending, `avg_position` sorts the best position first.
          schema:
            type: string
        - name: search_query
          in: query
          description: Filter results by a search string.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of items to return. Minimum 0; `0` returns every result and ignores `offset`.
          schema:
            type: integer
            default: 1000
        - name: offset
          in: query
          description: Number of items to skip from the start of the list. Minimum 0.
          schema:
            type: integer
            default: 0
