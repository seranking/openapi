  /v1/project-management/sites:
    get:
      operationId: listProjects
      tags:
        - Project Management
      summary: List projects
      description: Returns a list of all projects available in the user account.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/project-management/#list-projects
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Unique project (site) ID.
                    title:
                      type: string
                      description: Project name.
                    name:
                      type: string
                      description: Website URL associated with the project.
                    group_id:
                      type: integer
                      description: Project group ID.
                    is_active:
                      type: integer
                      description: |-
                        Project status:
                        • `1` – active
                        • `0` – delayed
                    exact_url:
                      type: integer
                      description: >-
                        If `1`, ranking positions are checked only for the specified URL, excluding subfolders and
                        subdomains.
                    subdomain_match:
                      type: integer
                      description: If `1`, SERP subdomains are taken into account.
                    depth:
                      type: integer
                      description: Ranking position collection depth.
                    check_freq:
                      type: string
                      description: Frequency of ranking checks.
                    check_day:
                      nullable: true
                      description: |-
                        • If `check_freq` is `check_weekly`, represents the day of the week (1 – Monday to 7 – Sunday). 
                        • If `check_freq` is `check_monthly`, represents the day of the month (1 – 31).
                      type: integer
                    guest_link:
                      type: string
                      description: Guest link to view project statistics without authorization.
              example:
                - id: 1
                  title: zniqpf tfallp mykqeg
                  name: Cronin.info
                  group_id: 0
                  is_active: 1
                  exact_url: 0
                  subdomain_match: 0
                  depth: 100
                  check_freq: check_daily
                  check_day: null
                  guest_link: https://seranking.com/guest.html?site_id=1&hv=0&hash=432&tab=detailed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |-
            curl -X GET 'https://api.seranking.com/v1/project-management/sites' \
              -H 'Authorization: Token YOUR_API_KEY'
    post:
      operationId: addProject
      tags:
        - Project Management
      summary: Add project
      description: |-
        Creates a new project in the user account.

        If successful, the server returns the `201` HTTP code and the ID of the project added to the account.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/project-management/#adding-a-project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Website URL.
                title:
                  type: string
                  description: Project name.
                depth:
                  type: integer
                  description: Ranking collection depth (100, 200). Defaults to 100.
                subdomain_match:
                  type: integer
                  description: Include subdomains in SERPs (`1` – yes, `0` – no). Defaults to `0`.
                exact_url:
                  type: integer
                  description: Track only the specified URL (`1` – yes, `0` – no). Defaults to `0`.
                check_freq:
                  type: string
                  description: >-
                    Check frequency (`check_daily`, `check_1in3`, `check_weekly`, `check_monthly`, `manual`). Defaults
                    to `check_daily`.
                auto_reports:
                  type: integer
                  description: Enable weekly reports (`1` – yes, `0` – no). Defaults to `1`.
                disable_audit:
                  type: integer
                  description: Disable website audit (`1` – yes, `0` – no). Defaults to `0`.
                site_group_id:
                  type: integer
                  description: Project group ID.
                check_day:
                  type: integer
                  description: Day of week (1–7) for weekly checks or day of month (1–31) for monthly checks.
                is_active:
                  type: integer
                  description: Project status (`1` – active, `0` – delayed).
              required:
                - url
                - title
            example:
              url: http://test.site/
              title: seo site
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_id:
                    type: integer
                    description: ID of the created project.
              example:
                site_id: 507052
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |-
            curl -X POST 'https://api.seranking.com/v1/project-management/sites' \
              -H 'Authorization: Token YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '[{"url": "http://test.site/","title": "seo site"}]'
