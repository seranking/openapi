  /v1/project-management/sites/positions/history:
    get:
      operationId: getRankingTrendsOverTime
      tags:
        - Project Management
      summary: Get ranking trends over time
      description: >-
        Returns per-engine and cross-engine **time series** for a project’s rank-tracking metrics. This is the single
        endpoint behind trend analysis, regression detection, weekly/monthly performance reports, and the in-app
        position-history chart. By default the response contains:


        - **One series per project search engine** (`type: "search_engine"`), labelled with the engine’s name.


        - **One cross-engine aggregate** (`type: "avg"`, `name: "Average for all"`).


        The `type` request parameter selects which metric the series carries — see [Metric
        semantics](#metric-semantics). The aggregation rule the `avg` row uses depends on `type` — see [Cross-engine
        aggregation](#cross-engine-aggregation).


        Filter parameters (`group_id`, `keywords_ids[]`, `tags_ids[]`) **intersect** — a keyword must satisfy every
        supplied filter to count toward the aggregate. `site_engine_id` is orthogonal: it narrows which engines’ series
        come back, not which keywords participate.


        **Cross-engine aggregation**


        For multi-engine projects, the `avg` row aggregates **differently per `type`**. This is the single biggest thing
        to keep in mind on this endpoint.


        ⚠️ **The `Average for all` row is a marketing-grade aggregate, not analytics-grade.** Engine weights are equal
        regardless of how many keywords each engine tracks, except for `top10` (sum) and `top10_percent` (project-total
        denominator). On any project with imbalanced engine keyword counts, the `avg` row will misrepresent the
        project’s true picture. For analytics, ignore `avg`, fetch per-engine series, and recompute with the weighting
        that matches your question.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/project-management/#get-ranking-trends-over-time
      parameters:
        - name: site_id
          in: query
          required: true
          description: Project ID (returned by `GET /sites`).
          schema:
            type: integer
        - name: site_engine_id
          in: query
          description: >-
            Limit to a single project search engine. **Project-local engine ID** (from `GET /sites/search-engines`).
            **Setting this also drops the `avg` row from the response** — see [`avg` row presence](#avg-row-presence).
          schema:
            type: integer
        - name: date_from
          in: query
          description: >-
            Start date `YYYY-MM-DD`, inclusive. Defaults to `today − 7 days`, clamped to the project’s first check date
            for younger projects.
          schema:
            type: string
        - name: date_to
          in: query
          description: End date `YYYY-MM-DD`, inclusive. Defaults to today.
          schema:
            type: string
        - name: type
          in: query
          description: >-
            Chart metric. One of `avg_pos`, `visibility`, `visibility_percent`, `top10`, `top10_percent`. Defaults to
            `avg_pos`.
          schema:
            type: string
        - name: group_id
          in: query
          description: Filter to a keyword group ID (from `GET /keywords/groups`).
          schema:
            type: integer
        - name: keywords_ids[]
          in: query
          description: >-
            Filter to specific keyword IDs (from `GET /keywords`). Repeat the param for each ID — e.g.
            `keywords_ids[]=42&keywords_ids[]=99`.
          schema:
            type: array
            items:
              type: integer
        - name: tags_ids[]
          in: query
          description: >-
            Filter to keywords associated with the given landing-page tag IDs (from `GET /sites/url-tags`). Repeat the
            param for each ID.
          schema:
            type: array
            items:
              type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: >-
                            Human label. For `type: search_engine`, the **global** engine’s name (e.g. `Google USA`).
                            For `type: avg`, the literal `Average for all`. **May be non-unique** — see [Engine `name`
                            can be non-unique](#engine-name-can-be-non-unique).
                        type:
                          type: string
                          description: "`search_engine` for a per-engine series, `avg` for the cross-engine aggregate."
                        search_engine_id:
                          type: integer
                          nullable: true
                          description: >-
                            **Project-local site_engine_id** — matches the `site_engine_id` value returned by `GET
                            /sites/search-engines`, *not* the global engine catalogue ID. The response field is named
                            `search_engine_id` for legacy reasons. `null` on the `avg` row.
                        data:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                description: Check date `YYYY-MM-DD`.
                              value:
                                description: >-
                                  Metric value for `type`. **Heterogeneous** — sometimes string, sometimes number.
                                  Always coerce with `Number(point.value)` — see [`value` type
                                  heterogeneity](#value-type-heterogeneity).
                            description: >-
                              Time series points, ascending by date. One entry per check date in the requested range.
                              May be **empty** for valid reasons (see [Empty per-engine
                              series](#empty-per-engine-series)).
                          description: >-
                            Time series points, ascending by date. One entry per check date in the requested range. May
                            be **empty** for valid reasons (see [Empty per-engine series](#empty-per-engine-series)).
                      description: >-
                        Time series points, ascending by date. One entry per check date in the requested range. May be
                        **empty** for valid reasons (see [Empty per-engine series](#empty-per-engine-series)).
                    description: >-
                      Time series points, ascending by date. One entry per check date in the requested range. May be
                      **empty** for valid reasons (see [Empty per-engine series](#empty-per-engine-series)).
              example:
                data:
                  - name: Google USA
                    type: search_engine
                    search_engine_id: 1167043
                    data:
                      - date: "2026-05-10"
                        value: "94"
                      - date: "2026-05-11"
                        value: "88"
                      - date: "2026-05-12"
                        value: "88"
