    post:
      operationId: addPrompts
      tags:
        - AI Results Tracker
      summary: Add prompts
      description: >-
        Adds new prompts to the specified LLM engine. Duplicate prmpts for the same LLM engine are automatically
        skipped.


        Returns the count of actually added prompts (excluding duplicates) in the HTTP status `201`. If the site or LLM
        engine is not found, the API returns the `404` HTTP status code (for more information, see [Error
        handling](https://seranking.com/api/project/getting-started/#error-handling)).
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/ai-result-tracker/#add-prompts
      parameters:
        - name: site_id
          in: query
          required: true
          description: Site ID (path parameter).
          schema:
            type: integer
        - name: llm_id
          in: query
          required: true
          description: LLM engine ID (path parameter).
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompts:
                  type: array
                  items:
                    type: string
                  description: Prompts to add. Minimum 1 item. Each item non-empty (whitespace-only rejected), max 255 characters.
                group_id:
                  type: integer
                  description: Target prompt group ID. Defaults to the site’s default group.
              required:
                - prompts
            example:
              prompts:
                - best seo tool
                - seo rank tracker
                - website audit tool
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_llm_id:
                    type: integer
                    description: LLM engine ID.
                  site_id:
                    type: integer
                    description: Site ID.
                  added:
                    type: integer
                    description: Number of prompts actually added (excluding duplicates).
                  prompts:
                    type: array
                    items:
                      type: integer
                      description: Array of `prompt_llm_id` values for added prompts.
                    description: Array of `prompt_llm_id` values for added prompts.
              example:
                site_llm_id: 151294
                site_id: 11270054
                added: 3
                prompts:
                  - 1411621
                  - 1411624
                  - 1411627
