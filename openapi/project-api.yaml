          description: Site ID (path parameter).
          schema:
            type: integer
        - name: llm_id
          in: query
          description: LLM engine ID (path parameter).
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: LLM engine ID.
                        site_id:
                          type: integer
                          description: Site ID.
                        base_name:
                          type: string
                          description: LLM engine base name (e.g., `chatgpt`, `google_ai_overview`).
                        country_code:
                          type: string
                          description: ISO 3166-1 alpha-2 country code.
                        region_name:
                          type: string
                          nullable: true
                          description: Specific region or locality name.
                        lang_code:
                          type: string
                          description: ISO 639-1 language code.
                        region_settings:
                          anyOf:
                            - type: object
                              properties:
                                lat:
                                  type: number
                                lng:
                                  type: number
                                uule:
                                  type: string
                                radius:
                                  type: integer
                            - type: array
                              maxItems: 0
                          description: >-
                            Engine-specific region settings. Object with `lat`, `lng`, `uule`, `radius` for geo-targeted
                            engines; empty array `[]` for engines without region settings.
                    title: List LLM engines
                  - type: object
                    properties:
                      id:
                        type: integer
                        description: LLM engine ID.
                      site_id:
                        type: integer
                        description: Site ID.
                      base_name:
                        type: string
                        description: LLM engine base name (e.g., `chatgpt`, `google_ai_overview`).
                      country_code:
                        type: string
                        description: ISO 3166-1 alpha-2 country code.
                      region_name:
                        type: string
                        description: Specific region or locality name.
                      lang_code:
                        type: string
                        description: ISO 639-1 language code.
                      region_settings:
                        type: object
                        properties:
                          lat:
                            type: number
                          lng:
                            type: number
                          uule:
                            type: string
                          radius:
                            type: integer
                        description: >-
                          Engine-specific region settings. Object with `lat`, `lng`, `uule`, `radius` for geo-targeted
                          engines; empty array `[]` for engines without region settings.
                    title: Get LLM engine
              examples:
