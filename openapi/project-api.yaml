openapi: 3.0.3
info:
  title: SE Ranking Project API
  version: 1.0.0
  description: >-
    The Project API manages the SE Ranking projects in your account: projects and project groups, tracked keywords and
    rankings, search engines, competitors, URL tags, Google Search Console data, the marketing plan, website audits,
    Backlink Checker and AI Results Tracker.


    ## Authentication


    All endpoints are served from `https://api.seranking.com` and use one SE Ranking API key, the same key for the Data
    API, the Project API, the Local Marketing API and the SE Visible API. Send it in the `Authorization: Token
    YOUR_API_KEY` header (recommended) or as the `apikey` query parameter. See [Getting API
    access](https://seranking.com/api/how-to-get-api/).


    Rate limits: [API rate limits](https://seranking.com/api/rate-limits/). Credits: [API credit
    system](https://seranking.com/api/api-credits-system/).
  contact:
    name: SE Ranking API Support
    url: https://seranking.com/api/
    email: api@seranking.com
  license:
    name: MIT
    url: https://github.com/seranking/openapi/blob/main/LICENSE
externalDocs:
  description: SE Ranking Project API documentation
  url: https://seranking.com/api/project/
servers:
  - url: https://api.seranking.com
    description: Production
security:
  - tokenAuth: []
  - apikeyQuery: []
tags:
  - name: Account Management
    description: >-
      **Account Management API** provides endpoints to manage user account and sub-accounts, including creation,
      modification, deletion, access configuration, limits management, and project sharing.


      Documentation: [Account Management](https://seranking.com/api/project/account-management/)
  - name: Project Management
    description: |-
      **Project Management API** provides endpoints to manage projects and retrieve ranking-related data.

      It allows you to:

      - create, update, and delete projects

      - configure search engines for a project

      - add, update, and delete project keywords

      - retrieve keyword rankings and historical data

      - access project-level summary statistics

      - trigger manual ranking checks

      - manage manual ranking positions

      - retrieve advertising and SERP feature statistics

      Documentation: [Project Management](https://seranking.com/api/project/project-management/)
  - name: Project Groups
    description: |-
      **Project Groups API** provides endpoints to manage project groups within a user account.

      Documentation: [Project Groups](https://seranking.com/api/project/project-groups/)
  - name: Search Engine Setup
    description: >-
      This page documents the lookup data you need to attach and configure a Google search engine on a project: the
      engine catalogue, the city catalogue used for sub-country targeting, and the language catalogue.


      All three endpoints take no parameters, return data that changes rarely, and should be cached client-side.


      Documentation: [Search Engine Setup](https://seranking.com/api/project/general-data/)
  - name: Keyword Groups
    description: |-
      **Keyword Groups API** provides endpoints to manage keyword groups within a project.

      Documentation: [Keyword Groups](https://seranking.com/api/project/keyword-groups/)
  - name: Competitors
    description: >-
      **Competitors API** provides endpoints to manage competitors and retrieve competitor ranking data within a
      project.


      Documentation: [Competitors](https://seranking.com/api/project/competitors/)
  - name: URL Tags
    description: |-
      **URL Tags API** provides endpoints to manage landing page tags within a site.

      Documentation: [URL Tags](https://seranking.com/api/project/url-tags/)
  - name: Analytics Traffic
    description: >-
      **Analytics Traffic API** provides endpoints to retrieve analytics and traffic data for a project, including
      Google Search Console metrics, keyword traffic potential, and estimated SEO performance.


      Documentation: [Analytics Traffic](https://seranking.com/api/project/analytics-traffic/)
  - name: Marketing Plan
    description: >-
      **Marketing Plan API** provides endpoints to retrieve and manage marketing plan checklists for a site. These
      endpoints allow you to view marketing plan sections and tasks, create custom tasks, update task details, delete
      tasks, and change task completion status.


      Documentation: [Marketing Plan](https://seranking.com/api/project/marketing-plan/)
  - name: Website Audit
    description: >-
      The **Website Audit API** crawls sites on demand and surfaces technical SEO issues: broken links, missing tags,
      slow pages, indexability problems, and more. Results are retrieved on demand.


      Plan limits apply to the total number of pages crawled. Creating an audit and rechecking an audit both count
      crawled pages against that plan limit. All other operations (reads and configuration updates) are free.


      Documentation: [Website Audit](https://seranking.com/api/project/audit/)
  - name: Backlink Checker
    description: >-
      **Backlink Checker API** provides endpoints to retrieve, manage, import, group, and disavow backlinks, as well as
      monitor backlink import status and statistics.


      Documentation: [Backlink Checker](https://seranking.com/api/project/backlink-checker/)
  - name: AI Results Tracker
    description: >-
      **AI Results Tracker API** (AIRT) enables tracking of brand visibility across AI search engines. It covers three
      resource groups:


      - **Brands** — Configure which brand name to track for a site


      - **LLM engines** — Add and manage which AI engines to track (ChatGPT, Gemini, Google AI Overview, Google AI Mode)


      - **Prompts** — Manage prompts per engine and retrieve rankings data


      Documentation: [AI Results Tracker](https://seranking.com/api/project/ai-result-tracker/)
  - name: AI Results Tracker – Prompt Groups
    description: >-
      Organize tracked prompts into groups for cleaner reporting and bulk operations. Groups live at the site level and
      are shared across every LLM engine configured for that site; prompts are assigned to groups per engine. Data in
      the AI Result Tracker is refreshed daily.


      **Note:**


      - Each site has one non-deletable default group. New prompts land in the default group unless a `group_id` is
      specified at creation.


      - Deleting a non-default group moves its prompts to the default group.


      - Group names must be non-empty and unique within a site, maximum 255 characters.


      - Aggregated per-group metrics are not yet available in the public API; tracked in a follow-up task.


      Documentation: [AI Result Tracker – Prompt Groups](https://seranking.com/api/project/airt-groups/)
  - name: AI Results Tracker – Competitors
    description: >-
      AIRT Competitors API, part of the AI Results Tracker (AIRT), provides programmatic access to the per-prompt,
      per-day Competitors view: which brands and source URLs appear in AI answers for a tracked prompt over time, with a
      cached HTML copy of the answer page for human verification.


      All endpoints are engine-scoped (`llm_id`). To inspect a prompt across several engines, list the engines via [List
      LLM engines](https://seranking.com/api/project/ai-result-tracker/#list-llm-engines) and iterate.


      Using the API, you can:


      - retrieve the brands and source URLs cited in an AI answer for a prompt across a date range


      - list the dates on which a prompt was checked, so you can skip empty periods


      - get SEO metrics (Domain Trust, referring domains, organic keywords) for the cited sources


      **Note:**


      - `prompt_llm_id` values come from the `prompt_llm_id` field of [List
      prompts](https://seranking.com/api/project/ai-result-tracker/#list-prompts). The `prompt_id` field is a different
      value and is not accepted.


      - The full answer text is not returned by these endpoints. Fetch it per (prompt, date) via [Get prompt
      answer](https://seranking.com/api/project/ai-result-tracker/#get-prompt-answer); the `has_answer_text` flag tells
      you whether it is still available.


      **Data retention:**


      - Cached HTML copy: 30 days (`has_cached_copy`).


      - Answer text: 1 year (`has_answer_text`).


      Documentation: [AI Results Tracker – Competitors](https://seranking.com/api/project/airt-competitors/)
  - name: AI Results Tracker – Sources
    description: >-
      **AIRTSources API**, part of the AI Results Tracker (AIRT), provides programmatic access to project-level
      AI-search visibility across a date range. This includes domains and pages are cited as sources in AI answers, how
      often the project’s brand and its competitors are mentioned, and where mention opportunities exist.


      Unlike the [Competitors endpoints](https://seranking.com/api/project/airt-competitors/) (which are scoped to a
      single LLM engine), Sources data is **aggregated across all the project’s LLM engines** by default. Use
      `site_llm_ids[]` to narrow the scope to specific engines.


      Using the API, you can:


      - get a project-level summary of mention opportunities and per-competitor mention counts


      - list the source domains cited across your tracked prompts, with authority and mention metrics


      - list the individual source pages (URLs) cited, with per-page metrics


      - get outreach recommendations — high-impact sources and per-domain suggestions where your project is cited but
      not yet mentioned


      Documentation: [AI Results Tracker – Sources](https://seranking.com/api/project/airt-sources/)
paths:
  /v1/project-management/users/me:
    get:
      operationId: getUserProfile
      tags:
        - Account Management
      summary: Get user profile
      description: |-
        Returns profile information of the authenticated user account.

        No parameters.

        If successful, the server returns the `200` HTTP status code and the user profile data.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/account-management/#get-user-profile
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    description: Account email.
                  email_verified:
                    type: boolean
                    description: Email confirmation status (`true` – verified, `false` – not verified).
                  first_name:
                    type: string
                    description: User’s first name.
                  last_name:
                    type: string
                    description: User’s last name.
                  lang:
                    type: string
                    description: Account language (ISO 639-1 alpha-2).
                  picture:
                    type: string
                    description: Link to the user’s avatar (can be `null`).
              example:
                email: john.doe@example.com
                email_verified: true
                first_name: John
                last_name: Doe
                lang: en
                picture: https://online.seranking.com/files/public/avatar/se.png
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |-
            curl -X GET 'https://api.seranking.com/v1/project-management/users/me' \
              -H 'Authorization: Token YOUR_API_KEY'
  /v1/project-management/users:
    get:
      operationId: listSubAccounts
      tags:
        - Account Management
      summary: List sub-accounts / Get sub-account details
      description: >-
        ### List sub-accounts


        Returns a list of all sub-accounts associated with the authenticated user.


        If successful, the server returns the `200` HTTP status code and a list of sub-accounts.


        ### Get sub-account details


        Returns extended information about the specified sub-account, including settings, access permissions, and
        limits.


        If successful, the server returns the `200` HTTP status code and sub-account details. Returns HTTP `404` if the
        sub-account is not found (for more information, see [Error
        handling](https://seranking.com/api/project/getting-started/#error-handling)).
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/account-management/#list-sub-accounts
      parameters:
        - name: limit
          in: query
          description: Number of records per page. Defaults to `100`.
          schema:
            type: integer
        - name: offset
          in: query
          description: Number of records to skip for pagination.
          schema:
            type: integer
        - name: user_id
          in: query
          description: Unique sub-account ID (path parameter).
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  list:
                    type: array
                    items:
                      type: object
                      properties:
                        account_id:
                          type: integer
                          description: Unique sub-account ID.
                        account_email:
                          type: string
                          description: Sub-account email.
                        account_first_name:
                          type: string
                          description: Sub-account first name.
                        account_last_name:
                          type: string
                          description: Sub-account last name.
                        account_type:
                          type: string
                          description: "Account type: `user` or `client`."
                        account_lang:
                          type: string
                          description: Account language (ISO 639-1 alpha-2).
                        account_sites_count:
                          type: integer
                          description: Number of websites available to the sub-account.
                        is_blocked_by_limits:
                          type: boolean
                          description: Indicates whether limits are exceeded.
                      description: Array of sub-account objects.
                    description: Array of sub-account objects.
                  all_count:
                    type: string
                    description: Total number of sub-accounts.
                  settings:
                    type: object
                    properties:
                      account_id:
                        type: integer
                        description: Unique sub-account ID.
                      account_email:
                        type: string
                        description: Sub-account email.
                      account_first_name:
                        type: string
                        description: Sub-account first name.
                      account_last_name:
                        type: string
                        description: Sub-account last name.
                      account_type:
                        type: string
                        description: "Account type: `user` or `client`."
                      account_lang:
                        type: string
                        description: Account language (ISO 639-1 alpha-2).
                    description: Sub-account profile information.
                  access:
                    type: array
                    items:
                      type: string
                      description: >-
                        List of enabled
                        [permissions](https://seranking.com/api/project/sub-account-management/#permissions).
                    description: >-
                      List of enabled
                      [permissions](https://seranking.com/api/project/sub-account-management/#permissions).
                  limit:
                    type: object
                    properties:
                      site:
                        type: integer
                        description: Website limit.
                      keyword:
                        type: integer
                        description: Keyword limit.
                      backlink:
                        type: integer
                        description: Backlink check limit.
                      audit_account:
                        type: integer
                        description: Website verification limit per account.
                      audit_site:
                        type: integer
                        description: Website check limit per site per month.
                      balance:
                        type: object
                        properties:
                          amount:
                            type: integer
                            description: Monetary limit value.
                          period:
                            type: string
                            description: "Limit period: `day`, `week`, or `month`."
                        description: Payment limit configuration.
                    description: Sub-account limits configuration.
              examples:
                listSubAccounts:
                  summary: List sub-accounts
                  value:
                    list:
                      - account_id: 36865
                        account_email: user1@gmail.com
                        account_first_name: John
                        account_last_name: Doe
                        account_type: user
                        account_lang: ru
                        account_sites_count: 2
                        is_blocked_by_limits: false
                      - account_id: 36828
                        account_email: user2@gmail.com
                        account_first_name: Jane
                        account_last_name: Doe
                        account_type: client
                        account_lang: ru
                        account_sites_count: 1
                        is_blocked_by_limits: false
                    all_count: "2"
                getSubAccountDetails:
                  summary: Get sub-account details
                  value:
                    settings:
                      account_id: 36828
                      account_email: test@gmail.com
                      account_first_name: Test
                      account_last_name: Test
                      account_type: user
                      account_lang: ru
                    access:
                      - add_website
                      - audit_settings
                      - report_manual
                      - report_scheduled
                      - report_template
                    limit:
                      site: 10
                      keyword: 5
                      backlink: 10
                      audit_account: 4
                      audit_site: 3
                      balance:
                        amount: 5
                        period: day
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |-
            curl -X GET 'https://api.seranking.com/v1/project-management/users?limit=100&offset=0' \
              -H 'Authorization: Token YOUR_API_KEY'
        - lang: Shell
          label: cURL
          source: |-
            curl -X GET 'https://api.seranking.com/v1/project-management/users?user_id=123' \
              -H 'Authorization: Token YOUR_API_KEY'
    post:
      operationId: createSubAccount
      tags:
        - Account Management
      summary: Create sub-account
      description: |-
        Creates a new sub-account and sends a notification email to the specified sub-account address.

        The request body must contain a `data` object with sub-account configuration.

        If successful, the server returns the `201` HTTP status code and the created sub-account identifier.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/account-management/#create-sub-account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  setting:
                    type: object
                    properties:
                      account_email:
                        type: string
                        description: Sub-account email.
                      account_first_name:
                        type: string
                        description: Sub-account first name.
                      account_last_name:
                        type: string
                        description: Sub-account last name.
                      account_password:
                        type: string
                        description: Sub-account password.
                      account_lang:
                        type: string
                        description: Sub-account language (ISO 639-1 alpha-2).
                      account_type:
                        type: string
                        description: "Account type: `user` or `client`."
                  limit:
                    type: object
                    properties:
                      balance:
                        type: object
                        properties:
                          period:
                            type: string
                            description: "Limit period: `day`, `week`, `month`."
                          amount:
                            type: integer
                            description: Monetary limit value.
                  access:
                    type: array
                    items: {}
                    description: List of [permission codes](https://seranking.com/api/project/sub-account-management/#permissions).
                  key:
                    type: string
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        setting.account_email:
                          type: string
                        setting.account_first_name:
                          type: string
                        setting.account_last_name:
                          type: string
                        setting.account_password:
                          type: string
                        setting.account_type:
                          type: string
                        limit.balance.period:
                          type: string
                        limit.balance.amount:
                          type: integer
                        access:
                          type: array
                          items:
                            type: string
            example:
              - key: data
                value:
                  - setting.account_email: test10@gmail.com
                  - setting.account_first_name: Test
                  - setting.account_last_name: Test
                  - setting.account_password: TestPassword
                  - setting.account_type: user
                  - limit.balance.period: day
                  - limit.balance.amount: 10
                  - access:
                      - add_website
                      - audit_settings
                      - report_manual
                      - report_scheduled
                      - report_template
      responses:
        "201":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique sub-account ID.
              example:
                id: 36872
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |-
            curl -X POST 'https://api.seranking.com/v1/project-management/users' \
              -H 'Authorization: Token YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '[
              {
                "key": "data",
                "value": [
                  {"setting.account_email": "test10@gmail.com"},
                  {"setting.account_first_name": "Test"},
                  {"setting.account_last_name": "Test"},
                  {"setting.account_password": "TestPassword"},
                  {"setting.account_type": "user"},
                  {"limit.balance.period": "day"},
                  {"limit.balance.amount": 10},
                  {"access": [
                    "add_website",
                    "audit_settings",
                    "report_manual",
                    "report_scheduled",
                    "report_template"
                  ]}
                ]
              }
            ]'
    delete:
      operationId: deleteSubAccount
      tags:
        - Account Management
      summary: Delete sub-account
      description: >-
        Deletes a sub-account.


        If successful, the server returns an empty array. Returns HTTP `404` if the sub-account is not found (for more
        information, see [Error handling](https://seranking.com/api/project/getting-started/#error-handling)).
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/account-management/#delete-sub-account
      parameters:
        - name: user_id
          in: query
          required: true
          description: Unique sub-account ID (path parameter).
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items: {}
              example: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |-
            curl -X DELETE 'https://api.seranking.com/v1/project-management/users?user_id=123' \
              -H 'Authorization: Token YOUR_API_KEY'
    patch:
      operationId: updateSubAccount
      tags:
        - Account Management
      summary: Update sub-account
      description: >-
        Updates an existing sub-account.


        The request body must contain a `data` object with sub-account configuration.


        If successful, the server returns an empty array. Returns HTTP `404` if the sub-account is not found (for more
        information, see [Error handling](https://seranking.com/api/project/getting-started/#error-handling)).
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/account-management/#update-sub-account
      parameters:
        - name: user_id
          in: query
          required: true
          description: Unique sub-account ID (path parameter).
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  setting:
                    type: object
                    properties:
                      account_email:
                        type: string
                        description: Sub-account email.
                      account_first_name:
                        type: string
                        description: Sub-account first name.
                      account_last_name:
                        type: string
                        description: Sub-account last name.
                      account_password:
                        type: string
                        description: Sub-account password.
                      account_lang:
                        type: string
                        description: Sub-account language (ISO 639-1 alpha-2).
                      account_type:
                        type: string
                        description: "Account type: `user` or `client`."
                  limit:
                    type: object
                    properties:
                      balance:
                        type: object
                        properties:
                          period:
                            type: string
                            description: "Limit period: `day`, `week`, `month`."
                          amount:
                            type: integer
                            description: Monetary limit value.
                  access:
                    type: array
                    items: {}
                    description: List of [permission codes](https://seranking.com/api/project/sub-account-management/#permissions).
                  key:
                    type: string
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        setting.account_email:
                          type: string
                        setting.account_first_name:
                          type: string
                        setting.account_last_name:
                          type: string
                        setting.account_password:
                          type: string
                        setting.account_type:
                          type: string
                        limit.balance.period:
                          type: string
                        limit.balance.amount:
                          type: integer
                        access:
                          type: array
                          items:
                            type: string
            example:
              - key: data
                value:
                  - setting.account_email: test@gmail.com
                  - setting.account_first_name: Test
                  - setting.account_last_name: Test
                  - setting.account_password: TestPassword
                  - setting.account_type: user
                  - limit.balance.period: day
                  - limit.balance.amount: 10
                  - access:
                      - add_website
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items: {}
              example: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |-
            curl -X PATCH 'https://api.seranking.com/v1/project-management/users?user_id=123' \
              -H 'Authorization: Token YOUR_API_KEY' \
              -H 'Content-Type: application/json' \
              -d '[
              {
                "key":"data",
                "value": [
                  {"setting.account_email":"test@gmail.com"},
                  {"setting.account_first_name":"Test"},
                  {"setting.account_last_name":"Test"},
                  {"setting.account_password":"TestPassword"},
                  {"setting.account_type":"user"},
                  {"limit.balance.period":"day"},
                  {"limit.balance.amount":10},
                  {"access":["add_website"]}
                ]
              }
            ]'
  /v1/project-management/users/shared-sites:
    get:
      operationId: listSharedProjects
      tags:
        - Account Management
      summary: List shared projects
      description: |-
        Returns website IDs shared with the sub-account.

        If successful, the server returns the `200` HTTP status code and an array of website IDs.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/account-management/#list-shared-projects
