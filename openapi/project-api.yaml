                        domain: ahrefs.com
                        competitor_id: 1043944
                      - name: moz.com
                        domain: moz.com
                        competitor_id: 1043947
        "400":
          description: Invalid query parameters.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
