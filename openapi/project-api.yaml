  /v1/project-management/airt/sources/recommendations:
    get:
      operationId: getSourcesRecommendations
      tags:
        - AI Results Tracker – Sources
      summary: Get sources recommendations
      description: >-
        Ordered list from the Recommendations panel — for example “Secure Brand Mentions on High-Impact Sources” and
        per-domain outreach suggestions (Reddit, YouTube, Wikipedia, and others) where the project is cited but not yet
        mentioned.


        **Cost:** 0. Retrieving sources data does not consume API credits or subscription quota.


        The [shared filters](#shared-filters): `site_id`, `date_from`, `date_to`, `site_llm_ids[]`, `prompt_ids[]`,
        `group_ids[]`.


        Envelope: `site_id`, `site_llm_ids`, `date_from`, `date_to`, `items`.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/airt-sources/#get-sources-recommendations
      parameters:
        - name: site_id
          in: query
          required: true
          description: Site ID.
          schema:
            type: integer
        - name: date_from
          in: query
          description: Range start (`YYYY-MM-DD` format).
          schema:
            type: string
            default: 30 days before date_to
        - name: date_to
          in: query
          description: |-
            Range end (`YYYY-MM-DD` format). Cannot exceed the current date.

            Default: Current date
          schema:
            type: string
        - name: site_llm_ids[]
          in: query
          description: |-
            Narrow aggregation to specific LLM engines (repeatable).

            Default: All the project’s engines
          schema:
            type: array
            items:
              type: string
        - name: prompt_ids[]
          in: query
          description: Filter by tracked prompt IDs (repeatable).
          schema:
            type: array
            items:
              type: string
        - name: group_ids[]
          in: query
          description: Filter by prompt group IDs (repeatable). See [AIRT Groups](AIRT Groups).
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_id:
                    type: integer
                  site_llm_ids:
                    type: array
                    items:
                      type: integer
                  date_from:
                    type: string
                  date_to:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          description: "Recommendation type: `most_cited_sources` or `one_domain`."
                        code:
                          type: string
                          description: >-
                            Recommendation code: `secure_mentions` for the most-cited-sources recommendation; the domain
                            slug for `one_domain` (for example `reddit`, `youtube`, `quora`).
                        data:
                          description: >-
                            Recommendation payload. For `one_domain`: `domain` and `count` (numeric string). Empty array
                            for `most_cited_sources`.
              example:
                site_id: 11270054
                site_llm_ids:
                  - 151216
                  - 151294
                date_from: "2026-06-09"
                date_to: "2026-07-08"
                items:
                  - type: most_cited_sources
                    code: secure_mentions
                    data: []
                  - type: one_domain
                    code: reddit
                    data:
                      domain: reddit.com
                      count: "45"
                  - type: one_domain
                    code: youtube
                    data:
                      domain: youtube.com
                      count: "20"
        "400":
          description: Invalid query parameters.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Site not found.
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl
            'https://api.seranking.com/v1/project-management/airt/sources/recommendations?site_id=11270054&date_from=2026-06-09&date_to=2026-07-08'
            \
              -H 'Authorization: Token YOUR_API_KEY'
components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Recommended. Send the API key in the `Authorization` header with the `Token` scheme: `Authorization: Token
        YOUR_API_KEY`.
    apikeyQuery:
      type: apiKey
      in: query
      name: apikey
      description: >-
        Alternative. Send the API key as the `apikey` query parameter. It must always be a query parameter, even when
        other data goes in the request body.
  schemas:
    GatewayError:
      type: object
      description: Error returned by the API gateway before the request reaches the API.
      properties:
        error_description:
          type: string
          description: Human-readable error message.
  responses:
    Unauthorized:
      description: The API key is missing, unknown or disabled.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
          example:
            error_description: >-
              Authentication failed. Please ensure you have a valid, enabled API key. To get an API key, please contact
              us at api@seranking.com.
    PaymentRequired:
      description: The account has no active subscription or not enough credits for this request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
          example:
            error_description: >-
              Insufficient funds, API key is temporarily disabled. Please make a payment to enable you API key, or
              contact us at api@seranking.com.
    Forbidden:
      description: The API key may not call this endpoint or use this HTTP method.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
          example:
            error_description: >-
              Authentication failed. Please ensure you have a valid, enabled API key. To get an API key, please contact
              us at api@seranking.com.
    TooManyRequests:
      description: >-
        The request rate limit of the API key was exceeded. See [API rate
        limits](https://seranking.com/api/rate-limits/).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GatewayError"
          example:
            error_description: You made 11 requests, which is over the allowed limit of 10 requests per second. Please try again later.
