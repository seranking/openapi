  /v1/project-management/airt/competitors/source-metrics:
    get:
      operationId: getSourceMetrics
      tags:
        - AI Results Tracker – Competitors
      summary: Get source metrics
      description: |-
        Returns SEO metrics for the source URLs (or their domains) cited in the AI answer for a prompt on a given date:

        - **domain_trust** — Domain Trust score

        - **ref_domains** — number of referring domains

        - **organic_keywords** — number of organic keywords the URL or domain ranks for

        For Google AI Overview engines the source list also includes organic results.

        **Cost:** 0. Retrieving competitors data does not consume API credits or subscription quota.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/airt-competitors/#get-source-metrics
      parameters:
        - name: site_id
          in: query
          required: true
          description: Site ID.
          schema:
            type: integer
        - name: llm_id
          in: query
          required: true
          description: LLM engine ID.
          schema:
            type: integer
        - name: prompt_llm_id
          in: query
          required: true
          description: Prompt-to-LLM link ID from List prompts.
          schema:
            type: integer
        - name: date
          in: query
          required: true
          description: Check date (`YYYY-MM-DD` format). Available dates come from Get competitors check dates.
          schema:
            type: string
        - name: mode
          in: query
          description: "Metrics aggregation mode: `domain` (aggregated per source domain) or `url` (per exact source URL)."
          schema:
            type: string
            default: domain
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_id:
                    type: integer
                    description: Site ID.
                  site_llm_id:
                    type: integer
                    description: LLM engine ID.
                  prompt_llm_id:
                    type: integer
                    description: Prompt-to-LLM link ID.
                  date:
                    type: string
                    description: Check date.
                  mode:
                    type: string
                    description: "Aggregation mode used: `url` or `domain`."
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                          description: Source URL (`mode=url`) or domain (`mode=domain`).
                        domain:
                          type: string
                          description: Domain of the source.
                        domain_trust:
                          type: integer
                          description: Domain Trust score.
                        ref_domains:
                          type: string
                          description: Number of referring domains, encoded as a string. Coerce to an integer before arithmetic.
                        organic_keywords:
                          type: integer
                          description: Number of organic keywords the source ranks for.
                      description: Metrics per source (see below).
                    description: Metrics per source (see below).
              example:
                site_id: 11270054
                site_llm_id: 151216
                prompt_llm_id: 1411240
                date: "2026-07-08"
                mode: domain
                items:
                  - source: "[www.reddit.com](https://www.reddit.com)"
                    domain: "[www.reddit.com](https://www.reddit.com)"
                    domain_trust: 98
                    ref_domains: "2532163"
                    organic_keywords: 199918377
                  - source: "[www.semrush.com](https://www.semrush.com)"
                    domain: "[www.semrush.com](https://www.semrush.com)"
                    domain_trust: 96
                    ref_domains: "222992"
                    organic_keywords: 494418
        "400":
          description: Missing or invalid `date`, or invalid `mode`.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          description: Access denied to the requested site.
        "404":
          description: LLM engine or prompt not found.
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
