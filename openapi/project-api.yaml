  /v1/project-management/audits/found-links:
    get:
      operationId: getFoundLinks
      tags:
        - Website Audit
      summary: Get found links
      description: >-
        Returns every hyperlink found across the site. Supports filter chains for advanced queries (e.g., all nofollow
        external links returning `4xx`).


        To build complex queries, add an array of `filter` parameters to the URL query string. This allows you to chain
        multiple conditions together using logical operators. Each filter consists of three parts, formatted with an
        index in brackets (e.g., `filter[0]`, `filter[1]`).


        **Example 1: OR Logic**


        - `filter[0]` sets the base condition (`status = 301`).


        - `filter[1][type]=or` **explicitly connects** the next condition (`status = 302`) with an **OR**.


        **Example 2: AND Logic**


        To find all broken (`404`) image links (`anchor_type = image`).


        - `filter[0]` sets the base condition (`status = 404`).


        - `filter[1][type]=and` **must be included** to connect the second condition (`anchor_type = image`) with an
        **AND**. Omitting it would result in an error.


        If successful, the server returns the `200` HTTP status code and an object containing the total number of
        matching links and a list of link objects. Returns HTTP `404` if the audit is not found (for more information,
        see [Error handling](https://seranking.com/api/project/getting-started/#error-handling)).
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/audit/#recheck-audit
      parameters:
        - name: audit_id
          in: query
          required: true
          description: Unique audit ID (path parameter).
          schema:
            type: integer
        - name: page_type
          in: query
          description: Fields to change. See [Audit settings object](#audit-settings-object).
          style: deepObject
          explode: true
          schema:
            type: object
        - name: limit
          in: query
          description: Number of links to return.
          schema:
            type: integer
        - name: offset
          in: query
          description: Starting position for pagination.
          schema:
            type: integer
        - name: filter
          in: query
          description: Filter chain. Each entry is `{ param, value, type? }`. See below.
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of links matching the request criteria.
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          description: Destination URL.
                        id:
                          type: string
                          description: Unique link identifier.
                        status:
                          type: string
                          description: HTTP status code of the destination URL.
                        type:
                          type: string
                          description: >-
                            Logical operator used to combine conditions. Possible values: `and`, `or`. Required starting
                            from the second filter condition.
                        source_url:
                          type: string
                          description: URL of the page where the link was found.
                        source_noindex:
                          type: string
                          description: Indicates whether the source page has a noindex directive (`1` –yes, `0` – no).
                        nofollow:
                          type: string
                          description: Indicates whether the link has a nofollow attribute (`1` –yes, `0` – no).
                        alt:
                          type: string
                          description: Alt attribute of the link, if available.
                        anchor_type:
                          type: string
                          description: Anchor type (for example, `text` or `image`).
                        anchor:
                          type: string
                          description: Visible anchor text of the link.
                        title:
                          type: string
                          description: Title attribute of the link, if available.
                      description: Array of link objects.
                    description: Array of link objects.
              example:
                total: 103624
                items:
