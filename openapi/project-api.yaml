    get:
      operationId: listLLMEngines
      tags:
        - AI Results Tracker
      summary: List LLM engines / Get LLM engine
      description: >-
        ### List LLM engines


        Returns all LLM engines configured for the specified site.


        Returns an array of LLM engine objects.


        ### Get LLM engine


        Returns details of a specific LLM engine.


        If the LLM engine is not found, the API returns the `404` HTTP status code (for more information, see [Error
        handling](https://seranking.com/api/project/getting-started/#error-handling)).
