  /v1/project-management/sites/positions:
    get:
      operationId: getKeywordStatistics
      tags:
        - Project Management
      summary: Get keyword statistics
      description: >-
        Returns keyword ranking statistics for the specified project within a selected time period.


        If successful, the server returns a JSON array grouped by `site_engine_id`, containing keyword statistics for
        the specified period. If an error occurs (e.g., invalid `site_engine_id`), the API returns the corresponding
        HTTP status code and error message (for more information, see [Error
        handling](https://seranking.com/api/project/getting-started/#error-handling)).
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/project-management/#keyword-statistics
      parameters:
        - name: site_id
          in: query
          required: true
          description: Unique project (site) ID.
          schema:
            type: integer
        - name: date_from
          in: query
          description: Start date of the time period (`YYYY-MM-DD`). The default is today minus one week.
          schema:
            type: string
        - name: date_to
          in: query
          description: End date of the time period (`YYYY-MM-DD`). The default is today.
          schema:
            type: string
        - name: site_engine_id
          in: query
          description: Search engine configuration ID. If not specified, data for all search engines is returned.
          schema:
            type: integer
        - name: in_top
          in: query
          description: >-
            Filter by ranking position. Example: `in_top=10` returns keywords ranking in the TOP 10 at the last check
            date within the selected period.
          schema:
            type: integer
        - name: with_landing_pages
          in: query
          description: Landing page URLs found in SERPs (`1` – include).
          schema:
            type: integer
        - name: with_serp_features
          in: query
          description: Detected Google SERP features (`1` – include).
          schema:
            type: integer
        - name: with_content_score
          in: query
          description: Per-keyword Content Score (`1` – include).
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    site_engine_id:
                      type: integer
                      description: Search engine configuration ID.
                    keywords:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Unique keyword ID.
                          positions:
                            type: array
                            items:
                              type: object
                              properties:
                                date:
                                  type: string
                                  description: Date (`YYYY-MM-DD`).
                                pos:
                                  type: integer
                                  description: Current ranking position.
                                change:
                                  type: integer
                                  description: Change in position compared to the previous date (could be negative).
                                price:
                                  type: integer
                                  description: Price calculated from financial report settings.
                                is_map:
                                  type: integer
                                  description: |-
                                    Results where the position was found:
                                    • `0` – organic search results
                                    • `1` – maps block
                                map_position:
                                  type: integer
                                  description: >-
                                    Position in the maps block when `merge_map` is `2` (i.e., “Display organic and maps
                                    results separately” is enabled).
                                paid_position:
                                  type: integer
                                  description: Position in paid Google SERPs.
                              description: Ranking positions by date.
                            description: Ranking positions by date.
                          volume:
                            type: integer
                            description: Search volume.
                          competition:
                            type: integer
                            description: Competition level.
                          suggested_bid:
                            type: integer
                            description: Estimated cost per click.
                          kei:
                            type: integer
                            description: Keyword Efficiency Index.
                          results:
                            type: integer
                            description: Number of search results in Google.
                          content_score:
                            type: integer
                            description: >-
                              Content Score for the keyword (`0–100`), based on Top-10 competitors. `null` when no score
                              is available.
                          content_score_change:
                            type: integer
                            description: >-
                              Content Score change versus the previous check. `null` when there is no previous score to
                              compare.
                          total_sum:
                            type: integer
                            description: Price per keyword (based on financial report settings).
                          landing_pages:
                            type: array
                            items:
                              type: object
                              properties:
                                url:
                                  type: string
                                date:
                                  type: string
                                  description: Date (`YYYY-MM-DD`).
                              description: |-
                                Landing page data:
                                `date` – ranking check date (`YYYY-MM-DD`)
                                `url` – page URL in SERPs for the keyword
                            description: |-
                              Landing page data:
                              `date` – ranking check date (`YYYY-MM-DD`)
                              `url` – page URL in SERPs for the keyword
                          features:
                            type: object
                            properties:
                              tads:
                                type: boolean
                              knowledge_graph:
                                type: boolean
                              images:
                                type: boolean
                              sitelinks:
                                type: boolean
                              reviews:
                                type: boolean
                            description: >-
                              Detected SERP features. Each field is `true` if the feature links to the project’s
                              website; otherwise `false`.
                        description: List of keywords with statistics.
                      description: List of keywords with statistics.
              example:
                - site_engine_id: 1
                  keywords:
                    - id: "12"
                      positions:
                        - date: "2017-12-19"
                          pos: 18
                          change: 0
                          price: 0
                          is_map: 0
                          map_position: 0
                          paid_position: 0
                      volume: 390
                      competition: 3
                      suggested_bid: 1
                      kei: 1
                      results: 100
                      content_score: 66
                      content_score_change: -2
                      total_sum: 0
                      landing_pages:
                        - url: https://domain.com/page.html
                          date: "2017-12-14"
                      features:
                        tads: true
                        knowledge_graph: true
                        images: true
                        sitelinks: true
                        reviews: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
