                                type: string
                                description: Domain name.
                              competitor_id:
                                type: integer
                            description: >-
                              Brands mentioned on the domain’s cited pages. Each object: `name`, `domain`, and
                              `competitor_id` — `competitor_id` is present only for tracked competitors, omitted
                              otherwise.
                          description: >-
                            Brands mentioned on the domain’s cited pages. Each object: `name`, `domain`, and
                            `competitor_id` — `competitor_id` is present only for tracked competitors, omitted
                            otherwise.
              example:
                site_id: 11270054
                site_llm_ids:
                  - 151216
