    delete:
      operationId: deleteAudit
      tags:
        - Website Audit
      summary: Delete audit / Delete audit source pages
      description: >-
        ### Delete audit


        Permanently deletes the specified website audit report and all associated data. This action can’t be undone.


        If successful, the server returns the `200` HTTP status code and an empty response body. Returns HTTP `404` if
        the audit is not found (for more information, see [Error
        handling](https://seranking.com/api/project/getting-started/#error-handling)).


        ### Delete audit source pages


        Removes an uploaded custom page list. Does not toggle `settings.source_file` off. Use `updateAuditSettings` to
        disable custom-list crawling entirely.


        HTTP `204 No Content` on success.


        Used by `createAudit`, `updateAuditSettings`, `getAuditSettings`, and `getAuditHistory`. Every field is
        optional. Send only the fields to change; other values stay untouched (exceptions are called out below).


        **URL filtering**


        **Note:** Multiple paths must be separated by newline.


        **Reporting**


        **Note:** Multiple emails must be comma-separated.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/audit/#delete-audit
      parameters:
        - name: audit_id
          in: query
          required: true
          description: Unique audit ID (path parameter).
          schema:
            type: integer
        - name: list_id
          in: query
          description: List identifier from `List Audit Source Pages`.
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
        "204":
          description: No content.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
