            \

            --header 'Authorization: Token YOUR_API_KEY'
    post:
      operationId: addAuditSitemap
      tags:
        - Website Audit
      summary: Add audit sitemap
      description: Registers a sitemap URL as a crawl source. Auto-sets `settings.source_sitemap` to `1` so the next run uses it.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/audit/#update-audit-title
