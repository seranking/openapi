          in: query
          description: Shown in the documented request example.
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current:
                    type: string
                    description: Current check date (in `YYYY-MM-DD`).
                  day_ago:
                    type: string
                    description: Closest date to one day ago.
                  7days:
                    type: string
                    description: Closest date to seven days ago.
