  /v1/project-management/airt/sources/domains:
    get:
      operationId: listSourceDomains
      tags:
        - AI Results Tracker – Sources
      summary: List source domains
      description: >-
        Outreach target list: domains cited as sources in LLM answers, default sort by AI answers descending. Each row
        carries the Domains-tab columns: status, pages/AI-answers/prompts counts, coverage %, brand mention rate %,
        mentioned brands, Domain Trust, backlinks, referring domains, and a per-engine usage breakdown
        (`usage_count_by_llm`).


        **Cost:** 0. Retrieving sources data does not consume API credits or subscription quota.


        Envelope: `site_id`, `site_llm_ids`, `date_from`, `date_to`, `limit`, `offset`, `total`, `items`.


        **Warning:** `usage_count` values are returned as JSON strings. Coerce them to integers before arithmetic.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/airt-sources/#list-source-domains
      parameters:
        - name: site_id
          in: query
          required: true
          description: Site ID.
          schema:
            type: integer
        - name: date_from
          in: query
          description: Range start (`YYYY-MM-DD` format).
          schema:
            type: string
            default: 30 days before date_to
        - name: date_to
          in: query
          description: |-
            Range end (`YYYY-MM-DD` format). Cannot exceed the current date.

            Default: Current date
          schema:
            type: string
        - name: site_llm_ids[]
          in: query
          description: |-
            Narrow aggregation to specific LLM engines (repeatable).

            Default: All the project’s engines
          schema:
            type: array
            items:
              type: string
        - name: prompt_ids[]
          in: query
          description: Filter by tracked prompt IDs (repeatable).
          schema:
            type: array
            items:
              type: string
        - name: group_ids[]
          in: query
          description: Filter by prompt group IDs (repeatable). See [AIRT Groups](AIRT Groups).
          schema:
            type: array
            items:
              type: string
        - name: competitor_ids[]
          in: query
          description: Filter to sources where the given competitor brands appear (repeatable).
          schema:
            type: array
            items:
              type: string
        - name: is_brand_mentioned
          in: query
          description: Restrict to sources where the project’s brand is (`1`) or is not (`0`) mentioned.
          schema:
            type: integer
        - name: has_link
          in: query
          description: Restrict to sources that link (`1`) or do not link (`0`) to the project.
          schema:
            type: integer
        - name: search
          in: query
          description: Substring match on the source domain.
          schema:
            type: string
        - name: limit
          in: query
          description: Number of items per page (1–100).
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          description: Offset from the beginning of the list.
          schema:
            type: integer
            default: 0
        - name: sort
          in: query
          description: >-
            Sort field: `domain`, `pages_total`, `ai_answers_total`, `prompts_total`, `prompts`, `coverage_percent`,
            `brand_mentions_total`, `mention_rate_percent`, `dt`, `backlinks_total`, `referring_domains_total`.
          schema:
            type: string
            default: ai_answers_total
        - name: sort_order
          in: query
          description: "Sort direction: `asc` or `desc`."
          schema:
            type: string
            default: desc
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_id:
                    type: integer
                  site_llm_ids:
                    type: array
                    items:
                      type: integer
                  date_from:
                    type: string
                  date_to:
                    type: string
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        domain_id:
                          type: integer
                          description: Domain ID. Use as `domain_id` in List source pages to restrict to this domain.
                        domain:
                          type: string
                          description: Domain name.
                        pages_total:
                          type: integer
                          description: Number of this domain’s pages cited as sources.
                        ai_answers_total:
                          type: integer
                          description: Number of AI answers citing the domain.
                        prompts:
                          type: integer
                          description: Number of prompts whose answers cite the domain.
                        brand_mentions_total:
                          type: integer
                          description: Mentions of the project’s brand on the domain’s cited pages.
                        first_seen:
                          type: string
                          description: First date the domain was seen as a source (`YYYY-MM-DD`).
                        last_seen:
                          type: string
                          description: Most recent date the domain was seen as a source (`YYYY-MM-DD`).
                        dt:
                          type: integer
                          description: Domain Trust.
                        backlinks_total:
                          type: integer
                          description: Total backlinks to the project from this domain.
                        referring_domains_total:
                          type: integer
                          description: Referring domains.
                        coverage_percent:
                          type: number
                          description: Share of tracked prompts whose answers cite the domain (0–100).
                        mention_rate_percent:
                          type: number
                          description: Brand mention rate across the domain’s cited pages (0–100).
                        is_project:
                          type: integer
                          description: "`1` when the domain is the project’s own domain, `0` otherwise."
                        is_competitor:
                          type: integer
                          description: "`1` when the domain belongs to a tracked competitor, `0` otherwise."
                        total_answers:
                          type: integer
                          description: Total AI answers in scope for the range.
                        prompts_total:
                          type: integer
                          description: Same value as `prompts`.
                        status:
                          type: string
                          description: "Parsing status: `parsed`, `in_progress`, `not_parsed`, or `not_available`."
                        usage_count_by_llm:
                          type: array
                          items:
                            type: object
                            properties:
                              site_llm_id:
                                type: integer
                              usage_count:
                                type: string
                            description: >-
                              Per-engine usage breakdown. Each object: `site_llm_id` (integer), `usage_count` (numeric
                              string).
                          description: >-
                            Per-engine usage breakdown. Each object: `site_llm_id` (integer), `usage_count` (numeric
                            string).
                        mentions:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
