  /v1/project-management/sites/positions/recheck:
    post:
      operationId: runPositionCheck
      tags:
        - Project Management
      summary: Run position check
      description: >-
        Triggers a ranking position check for selected keywords or for an entire project.


        * Required unless `site_engine_id` alone is used to recheck all keywords for that search engine.


        If successful, the server returns the number of keywords scheduled for recheck. Returns HTTP `400` if an unknown
        `site_engine_id` is provided (for more information, see [Error
        handling](https://seranking.com/api/project/getting-started/#error-handling)).
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/project-management/#run-position-check
      parameters:
        - name: site_id
          in: query
          description: Shown in the documented request example.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                site_engine_id:
                  type: integer
                  description: Search engine configuration ID.
                keywords:
                  type: array
                  items:
                    type: object
                    properties:
                      site_engine_id:
                        type: integer
                      keyword_id:
                        type: integer
                  description: List of keyword objects to recheck. If provided, `site_engine_id` is ignored.
                keyword_id:
                  type: integer
                  description: Keyword ID.
              required:
                - keywords
            example:
              keywords:
                - site_engine_id: 1
                  keyword_id: 2
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
