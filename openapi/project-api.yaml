              schema:
                type: object
                properties:
                  site_id:
                    type: integer
                    description: Site ID.
                  site_llm_ids:
                    type: array
                    items:
                      type: integer
                      description: LLM engine IDs included in the aggregation.
                    description: LLM engine IDs included in the aggregation.
