  /v1/project-management/airt/competitors:
    get:
      operationId: getCompetitorsBreakdown
      tags:
        - AI Results Tracker – Competitors
      summary: Get competitors breakdown
      description: >-
        For each requested prompt over a date range, returns one entry per check date with:


        - **Brands mentioned** in the AI answer, ordered as displayed


        - **Source URLs** cited in the answer, ordered as displayed


        - **Cached copy URL** for human verification (opt out via `include_cached_copy_url=0`)


        Dates without a check are omitted from `results`. A check with no sources or brands is returned with empty
        `brands` and `sources` arrays.


        **Limits:**


        - Up to 50 `prompt_llm_ids[]` per request.


        - Date range up to 366 days.


        - Requested prompts multiplied by date range days must not exceed 3,660.


        - Default range: last 7 days.


        **Compact mode (`compact=1`):** adjacent calendar days with identical brands and sources (and, for Google AI
        Overview, identical `ai_overview_present` and `organic_urls`) are collapsed into a single entry with a
        `date_from`/`date_to` range instead of `date`. Entry fields (`cached_copy_url`, flags) are taken from the most
        recent day of the run. Days separated by a gap without checks are never merged.


        **Google AI Overview:** entries additionally contain `ai_overview_present` and `organic_urls` (top 20 organic
        results).


        **Warning:** `cached_copy_url` points at the `api4.seranking.com` surface, which is not part of the unified
        gateway. As of July 9, 2026 the gateway API key is rejected there (`403`) with both `Authorization: Token`
        header and `?token=` query authentication, so the cached copy cannot currently be fetched with the same
        credentials. Raised with the AIRT team.


        **Cost:** 0. Retrieving competitors data does not consume API credits or subscription quota.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/airt-competitors/#get-competitors-breakdown
      parameters:
        - name: site_id
          in: query
          required: true
          description: Site ID.
          schema:
            type: integer
        - name: llm_id
          in: query
          required: true
          description: LLM engine ID.
          schema:
            type: integer
        - name: prompt_llm_ids[]
          in: query
          required: true
          description: Prompt-to-LLM link IDs from List prompts (repeatable). 1–50 IDs.
          schema:
            type: array
            items:
              type: string
        - name: date_from
          in: query
          description: Start date (`YYYY-MM-DD` format).
          schema:
            type: string
            default: 7 days before date_to
        - name: date_to
          in: query
          description: |-
            End date (`YYYY-MM-DD` format). Cannot exceed the current date.

            Default: Current date
          schema:
            type: string
        - name: include_cached_copy_url
          in: query
          description: Include the cached copy URL in every result entry.
          schema:
            type: boolean
            default: true
        - name: compact
          in: query
          description: Collapse consecutive days with identical brands and sources into date ranges.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_id:
                    type: integer
                    description: Site ID.
                  site_llm_id:
                    type: integer
                    description: LLM engine ID.
                  date_from:
                    type: string
                    description: Start date of the data range.
                  date_to:
                    type: string
                    description: End date of the data range.
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        prompt_llm_id:
                          type: integer
                          description: Prompt-to-LLM link ID.
                        prompt:
                          type: string
                          description: Prompt text.
                        results:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                description: Check date. Absent when `compact=1`.
                              brands:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    position:
                                      type: integer
                                    name:
                                      type: string
                                  description: >-
                                    Brands mentioned in the AI answer, ordered as displayed. Each object: `position`
                                    (1-based), `name`.
                                description: >-
                                  Brands mentioned in the AI answer, ordered as displayed. Each object: `position`
                                  (1-based), `name`.
                              sources:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    position:
                                      type: integer
                                    url:
                                      type: string
                                    domain:
                                      type: string
                                  description: >-
                                    Source URLs cited in the AI answer, ordered as displayed. Each object: `position`
                                    (1-based), `url`, `domain`.
                                description: >-
                                  Source URLs cited in the AI answer, ordered as displayed. Each object: `position`
                                  (1-based), `url`, `domain`.
                              has_cached_copy:
                                type: boolean
                                description: >-
                                  Whether the cached HTML copy is still available (stored for 30 days). Derived from the
                                  check date age, not from a per-day storage check; in rare cases the cached-copy
                                  endpoint can still respond with `404`.
                              has_answer_text:
                                type: boolean
                                description: >-
                                  Whether the answer text is still available (stored for 1 year). Fetch it via Get
                                  prompt answer.
                              cached_copy_url:
                                type: string
                                description: >-
                                  URL of the cached HTML copy endpoint. Only present when `include_cached_copy_url=1`
                                  (default). `null` when the copy is unavailable.
                            description: >-
                              One entry per check date (or per collapsed date range when `compact=1`), ordered by date
                              ascending.
                          description: >-
                            One entry per check date (or per collapsed date range when `compact=1`), ordered by date
                            ascending.
                      description: One item per requested prompt, in the order of `prompt_llm_ids[]`.
                    description: One item per requested prompt, in the order of `prompt_llm_ids[]`.
              example:
                site_id: 11270054
                site_llm_id: 151294
                date_from: "2026-07-01"
                date_to: "2026-07-08"
                items:
                  - prompt_llm_id: 1411621
                    prompt: best seo tool
                    results:
                      - date: "2026-07-08"
                        brands:
                          - position: 1
                            name: Semrush
                          - position: 2
                            name: SE Ranking
                        sources:
                          - position: 1
                            url: https://seranking.com/blog/best-seo-tools/
                            domain: seranking.com
                        has_cached_copy: true
                        has_answer_text: true
                        cached_copy_url: >-
                          https://api4.seranking.com/sites/11270054/airt/v2/llm/151294/prompts/1411621/cached-copy?date=2026-07-08
        "400":
          description: >-
            Missing or invalid `prompt_llm_ids[]`, invalid date format, `date_from` greater than `date_to`, or date
            range exceeds the limit.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          description: Access denied to the requested site.
        "404":
          description: LLM engine not found for this site, or prompt not found or does not belong to this LLM engine.
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl
            'https://api.seranking.com/v1/project-management/airt/competitors?site_id=11270054&llm_id=151294&prompt_llm_ids[]=1411621&prompt_llm_ids[]=1411624&date_from=2026-07-01&date_to=2026-07-08'
            \
              -H 'Authorization: Token YOUR_API_KEY'
