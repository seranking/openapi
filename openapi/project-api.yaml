        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  description: Domain to be audited (e.g., `domain.com`).
                title:
                  type: string
                  description: Custom title of the audit report (max 300 characters). Defaults to `domain`.
                settings:
                  type: object
                  description: >-
                    Audit configuration settings. Only include parameters you want to override (see [settings
                    object](https://seranking.com/api/project/audit/#settings-object) below).
                  properties:
                    source_site:
                      type: integer
                    source_sitemap:
                      type: integer
                    source_subdomain:
                      type: integer
                    source_file:
                      type: integer
                    check_robots:
                      type: integer
                    ignore_noindex:
                      type: integer
                    ignore_nofollow:
                      type: integer
                    ignore_params:
                      type: integer
                    custom_params:
                      type: string
                    csr:
                      type: integer
                    user_agent:
                      type: integer
                    login:
                      type: string
                    password:
                      type: string
                    max_pages:
                      type: integer
                    max_depth:
                      type: integer
                    max_req:
                      type: integer
                    max_redirects:
                      type: integer
                    max_size:
                      type: integer
                    min_title_len:
                      type: integer
                    max_title_len:
                      type: integer
                    min_description_len:
                      type: integer
                    max_description_len:
                      type: integer
                    min_words:
                      type: integer
                    max_h1_len:
                      type: integer
                    max_h2_len:
                      type: integer
                    allow:
                      type: string
                    disallow:
                      type: string
                    hide:
                      type: string
                    schedule_type:
                      type: string
                    schedule_wdays:
                      type: array
                      items:
                        type: integer
                    schedule_hour:
                      type: integer
                    schedule_day:
                      type: integer
                    schedule_repeat:
                      type: integer
                    schedule_repeat_interval:
                      type: integer
                    send_report:
                      type: integer
                    report_emails:
                      type: string
              required:
                - domain
            example:
              domain: example.com
              title: Full Audit - example.com
              settings:
                source_site: 1
                source_sitemap: 1
                source_subdomain: 1
                source_file: 0
                check_robots: 1
                ignore_noindex: 1
                ignore_nofollow: 1
                ignore_params: 2
                custom_params: utm_source, utm_medium, utm_term, utm_content, utm_campaign, cid, PHPSESSID, fbclid, gclid
                csr: 0
                user_agent: 0
                login: ""
                password: ""
                max_pages: 10000
                max_depth: 15
                max_req: 300
                max_redirects: 10
                max_size: 5000
                min_title_len: 30
                max_title_len: 60
                min_description_len: 50
                max_description_len: 160
                min_words: 300
                max_h1_len: 70
                max_h2_len: 80
                allow: |-
