  /v1/project-management/audits/issue-pages:
    get:
      operationId: getAuditPagesByIssue
      tags:
        - Website Audit
      summary: Get audit pages by issue
      description: >-
        Retrieves a paginated list of all URLs affected by a specific issue within the audit. The issue code can be
        obtained from the audit report.


        If successful, the server returns a JSON object containing the total number of affected URLs and the list of
        URLs.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/audit/#get-audit-pages-by-issue
      parameters:
        - name: audit_id
          in: query
          required: true
          description: Unique audit ID (path parameter).
          schema:
            type: integer
        - name: code
          in: query
          required: true
          description: Unique issue code (for example, `title_duplicate`).
          schema:
            type: string
        - name: limit
          in: query
          description: Number of URLs to return. Defaults to `100`.
          schema:
            type: integer
        - name: offset
          in: query
          description: Number of URLs to skip before starting to collect the result set. Defaults to `0`.
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_urls:
                    type: integer
                    description: Number of URLs affected by the issue.
                  urls:
                    type: array
                    items:
                      type: string
                      description: Array of URLs affected by the issue.
