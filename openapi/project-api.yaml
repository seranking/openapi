          label: cURL
          source: >-
            curl -X GET
            'https://api.seranking.com/v1/project-management/sites/positions?site_id=123&date_from=2018-01-01&date_to=2018-01-07&site_engine_id=1&with_landing_pages=1&with_serp_features=1&with_content_score=1'
            \
              -H 'Authorization: Token YOUR_API_KEY'
