  /v1/project-management/audits/history:
    get:
      operationId: getAuditHistory
      tags:
        - Website Audit
      summary: Get audit history
      description: >-
        Retrieves historical data for a specific audit run, including audit settings, domain metrics, and issue
        summaries.


        If successful, the server returns the `200` HTTP status code and an object containing historical audit data.
        Returns HTTP `404` if the audit or specified date is not found (for more information, see [Error
        handling](https://seranking.com/api/project/getting-started/#error-handling)).
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/audit/#get-audit-history
      parameters:
        - name: audit_id
          in: query
          required: true
          description: Unique audit ID (path parameter).
          schema:
            type: integer
        - name: date
          in: query
          required: true
          description: The specific date of the historical audit to retrieve (YYYY-MM-DD).
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit_time:
                    type: string
                    description: Date and time when the audit was completed.
                  domain_data:
                    type: object
                    properties:
                      dt:
                        type: integer
                        description: Domain trust score.
                      domain:
                        type: string
                        description: Audited domain.
                      backlinks:
                        type: string
                        description: Number of backlinks.
                      index_google:
                        type: string
                        description: Number of pages indexed by Google.
                    description: Domain metrics at the time of the audit.
                  settings:
                    type: object
                    properties:
                      source_site:
                        type: integer
                      source_sitemap:
                        type: integer
                      max_pages:
                        type: integer
                      max_depth:
                        type: integer
                    description: Audit configuration used for this historical run.
                  pages_data:
                    type: object
                    properties:
                      css3xx:
                        type: integer
                      css_big:
                        type: integer
                      h1_long:
                        type: integer
                      http4xx:
                        type: integer
                      title_duplicate:
                        type: integer
                      description_duplicate:
                        type: integer
                    description: Number of affected pages grouped by issue code.
                  totals:
                    type: object
                    properties:
                      total_pages:
                        type: integer
                        description: Total number of audited pages.
                      total_warnings:
                        type: integer
                        description: Total number of warnings found.
                      total_errors:
                        type: integer
                        description: Total number of errors found.
                      total_passed:
                        type: integer
                        description: Total number of passed checks.
                    description: Summary statistics of the audit results.
                  version:
                    type: string
                    description: Audit engine version.
              example:
                audit_time: "2025-07-29 11:19:33"
                domain_data:
                  dt: 44
                  domain: www.vitality.co.uk
                  backlinks: "212249"
                  index_google: "1380"
                settings:
                  source_site: 1
                  source_sitemap: 1
                  max_pages: 1000
                  max_depth: 10
                pages_data:
                  css3xx: 1
                  css_big: 880
                  h1_long: 19
                  http4xx: 28
                  title_duplicate: 143
                  description_duplicate: 169
                totals:
                  total_pages: 1009
                  total_warnings: 979
                  total_errors: 346
                  total_passed: 77
                version: "2.0"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl --location
            'https://api.seranking.com/v1/project-management/audits/history?audit_id=123&date=2025-07-29' \

            --header 'Authorization: Token YOUR_API_KEY'
