  /v1/project-management/airt/prompts/rankings:
    get:
      operationId: getPromptRankings
      tags:
        - AI Results Tracker
      summary: Get prompt rankings
      description: >-
        Retrieves ranking data for all prompts tracked by the specified LLM engine within a date range. Returns
        positions, URLs, search volume, search intent, and organic-AI overlap data for each prompt.


        If the site or LLM engine is not found, the API returns the `404` HTTP status code (for more information, see
        [Error handling](https://seranking.com/api/project/getting-started/#error-handling)).


        **Note:** When position and count fields are `null`, it means there was no AI result block on that date — not
        that the brand wasn’t found.


        **Groups mode (mode=groups)**


        When called with `mode=groups`, the endpoint returns aggregated time-series presence metrics per prompt group
        instead of per-prompt rankings. The envelope is identical to the default mode (`site_llm_id`, `site_id`,
        `date_from`, `date_to`, `items`, `total`, `limit`, `offset`); each entry in `items` represents one group rather
        than one prompt.


        **Note:** In groups mode, `limit` and `offset` paginate over groups — not prompts — and `total` is the count of
        groups in the response. A single matching group returns `total: 1` regardless of how many prompts it contains.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/ai-result-tracker/#get-rankings
      parameters:
        - name: site_id
          in: query
          required: true
          description: Site ID (path parameter).
          schema:
            type: integer
        - name: llm_id
          in: query
          required: true
          description: LLM engine ID (path parameter).
          schema:
            type: integer
        - name: date_from
          in: query
          description: |-
            Start date for rankings data (`YYYY-MM-DD` format).

            Default: Current date
          schema:
            type: string
        - name: date_to
          in: query
          description: |-
            End date for rankings data (`YYYY-MM-DD` format).

            Default: Current date
          schema:
            type: string
        - name: limit
          in: query
          description: Number of items per page (1–1000).
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          description: Offset from the beginning of the list.
          schema:
            type: integer
            default: 0
        - name: group_ids[]
          in: query
          description: Filter by prompt group IDs (repeatable).
          schema:
            type: integer
        - name: mode
          in: query
          description: >-
            Response mode. Omit (default) for per-prompt rankings. Set to `groups` to receive aggregated time-series
            presence metrics per prompt group; see [Groups mode](#groups-mode) for the full response shape.
          schema:
            type: string
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  site_llm_id:
                    type: integer
                    description: LLM engine ID.
                  site_id:
                    type: integer
                    description: Site ID.
                  date_from:
                    type: string
                    description: Start date of the data range.
                  date_to:
                    type: string
                    description: End date of the data range.
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        prompt_id:
                          type: integer
                          description: |-
                            Prompt ID (distinct from 
                            *prompt_llm_id*; this value is not accepted by Get prompt answer).
                        prompt:
                          type: string
                          description: Prompt text.
                        search_volume:
                          type: integer
                          nullable: true
                          description: Monthly search volume for the prompt.
                        search_intent:
                          type: array
                          items:
                            type: string
                            description: |-
                              Search intent codes:
                              • `I` – informational
                              • `N` – navigational
                              • `L` – local
                              • `C` – commercial
                              • `T` – transactional
                          nullable: true
                          description: |-
                            Search intent codes:
                            • `I` – informational
                            • `N` – navigational
                            • `L` – local
                            • `C` – commercial
                            • `T` – transactional
                        positions:
                          type: array
                          items:
                            type: object
                            properties:
                              date:
                                type: string
                                description: Check date.
                              url_position:
                                type: integer
                                description: |-
                                  Position of the site’s URL in AI results:
                                  • `null` – no AI result block on that date
                                  • `0` – URL not found in results
                                  • `1+` – position in results
                              urls_count:
                                type: integer
                                description: Total number of URLs present in AI results. `null` when no AI result block.
                              mention_position:
                                type: integer
                                description: |-
                                  Position of brand mention in AI results:
                                  • `null` – no AI result block on that date
                                  • `0` – brand not mentioned
                                  • `1+` – position of mention
                              mentions_count:
                                type: integer
                                description: Total number of brand mentions in AI results. `null` when no AI result block.
                              organic_overlap:
                                type: integer
                                nullable: true
                                description: Organic-AI overlap metric (0–100). `null` when no AI result block.
                              organic_overlap_percent:
                                type: integer
                                nullable: true
                                description: Organic overlap as percentage (0–100). `null` when no AI result block.
                              mention_presence:
                                type: integer
                                description: >-
                                  Percentage of prompts in the group with `mention_position > 0` on the date (0–100).
                                  For Google AI Overview engines, the denominator is “prompts where the AI Overview
                                  block was present”; for other engines, the denominator is “all prompts in the group”.
                              link_presence:
                                type: integer
                                description: >-
                                  Percentage of prompts in the group with `url_position > 0` on the date (0–100). Same
                                  denominator rule as `mention_presence`.
                              mention_presence_diff:
                                description: >-
                                  Change vs the previous date in the response, in percentage points. `null` for the
                                  first date in the range. Positive values are returned as signed strings (e.g.,
                                  `"+25"`); negative values and zero are returned as plain numbers (e.g., `-25`, `0`).
                                  Coerce with `Number()` before arithmetic.
                              link_presence_diff:
                                description: Same encoding rule as `mention_presence_diff`.
                            description: Daily position data (see below).
                          description: Daily position data (see below).
                        group_id:
                          type: integer
                          description: >-
                            Prompt group ID. Always returned. Without `group_ids[]` filter, the response includes one
                            item per existing group on the site; with the filter, it includes only the matching groups.
                        group_name:
                          type: string
                          description: >-
                            Group name (mirrors the name returned by [List prompt
                            groups](https://seranking.com/api/project/airt-groups/)).
                        prompts_count:
                          type: integer
                          description: >-
                            Number of prompts in the group at `date_to`. Counted per LLM engine, so the same group can
                            show different `prompts_count` values on different engines.
                        organic_overlap:
                          type: number
                          nullable: true
                          description: Organic-AI overlap metric (0–100). `null` when no AI result block.
                      description: Rankings data grouped by prompt (see below).
                    description: Rankings data grouped by prompt (see below).
                  total:
                    type: integer
                    description: Total number of prompts.
                  limit:
                    type: integer
                    description: Number of items per page.
                  offset:
                    type: integer
                    description: Offset from the beginning.
              examples:
                googleAIOverviewRankings:
                  summary: Google AI Overview rankings
                  value:
                    site_llm_id: 151216
                    site_id: 11270054
                    date_from: "2026-02-17"
                    date_to: "2026-02-19"
                    items:
                      - prompt_id: 1021696
                        prompt: What are the best tools for monitoring backlinks currently on the market?
                        search_volume: 0
