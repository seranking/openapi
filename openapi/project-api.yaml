    patch:
      operationId: updateAuditSettings
      tags:
        - Website Audit
      summary: Update audit settings
      description: >-
        Updates the configuration of an existing audit. Applies partial-update (merge) semantics: only the fields in the
        request body change.


        **Warning:** `disabled_issues` and `schedule_wdays` are REPLACE operations. The array you send replaces the full
        saved list. Fetch the current values with `getAuditSettings` before modifying them.


        Sitemaps and custom page lists have their own endpoints. See [`addAuditSitemap`](#add-audit-sitemap) and
        [`addAuditSourcePages`](#add-audit-source-pages). Updating only the audit title has a dedicated endpoint. See
        [`updateAuditTitle`](#update-audit-title).


        HTTP `200 OK` with an empty body.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/audit/#recheck-audit
      parameters:
        - name: audit_id
          in: query
          required: true
          description: Unique audit ID (path parameter).
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: object
                  properties:
                    max_pages:
                      type: integer
                    max_depth:
                      type: integer
                    schedule_type:
                      type: string
                    schedule_wdays:
                      type: array
                      items:
                        type: integer
                    disabled_issues:
                      type: array
                      items:
                        type: string
                    disallow_ext:
                      type: string
            example:
              settings:
                max_pages: 50000
                max_depth: 20
                schedule_type: week
                schedule_wdays:
                  - 1
                  - 3
                  - 5
                disabled_issues:
                  - slow_loading
                disallow_ext: |-
                  cdn.example.com
                  https://tracking.example.com/pixel
      responses:
        "200":
          description: Successful response.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl --location --globoff --request PATCH
            'https://api.seranking.com/v1/project-management/audits/settings?audit_id={audit_id}' \

            --header 'Content-Type: application/json' \

            --header 'Authorization: Token YOUR_API_KEY' \

            --data '{
              "settings": {
                "max_pages": 50000,
                "max_depth": 20,
                "schedule_type": "week",
                "schedule_wdays": [1, 3, 5],
                "disabled_issues": ["slow_loading"],
                "disallow_ext": "cdn.example.com\nhttps://tracking.example.com/pixel"
