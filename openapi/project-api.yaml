  /v1/project-management/airt/llm/statistics:
    get:
      operationId: getLLMStatistics
      tags:
        - AI Results Tracker
      summary: Get LLM statistics
      description: >-
        Returns statistics for the specified LLM engine, including presence stats, AIO presence, mentions/links, and
        organic overlap (AI Overview only).


        **Note:** When a date range is provided, only the **first** and **last** dates in the range are used. Values
        show data for the last date; diff values show the change from first to last date in percentage points.


        If the LLM engine is not found, the API returns the `404` HTTP status code (for more information, see [Error
        handling](https://seranking.com/api/project/getting-started/#error-handling)).
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/ai-result-tracker/#llm-statistics
      parameters:
        - name: site_id
          in: query
          required: true
          description: Site ID (path parameter).
          schema:
            type: integer
        - name: llm_id
          in: query
          required: true
          description: LLM engine ID (path parameter).
          schema:
            type: integer
        - name: from
          in: query
          description: |-
            Start date for date range (`YYYY-MM-DD` format). If not provided, defaults to the current date.

            Default: Current date
          schema:
            type: string
        - name: to
          in: query
          description: |-
            End date for date range (`YYYY-MM-DD` format). If not provided, defaults to the current date.

            Default: Current date
          schema:
            type: string
        - name: top
          in: query
          description: |-
            Top N positions to analyze (0–100):
            • `0` – all positions (default when omitted)
            • `3` – only the top 3 positions
            • `10` – only top 10 positions

            Default: 0 (all positions)
          schema:
            type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  llm_id:
                    type: integer
                    description: LLM engine ID.
                  site_id:
                    type: integer
                    description: Site ID.
                  top:
                    type: integer
                    description: "`top` value used for this query (0 = all positions)."
                  stats:
                    type: object
                    properties:
                      prompts_count:
                        type: integer
                        description: Total number of prompts.
                      last_update:
                        type: string
                        description: Date of the last check (`YYYY-MM-DD`).
                      indexed_percent:
                        type: integer
                        description: Percentage of prompts that have been indexed (0–100).
                  presence:
                    type: object
                    properties:
                      link_percent_in_top:
                        type: integer
                        description: Percentage of prompts with site link in Top N (0–100).
                      link_diff:
                        type: integer
                        description: Change in link percentage from first to last date (percentage points).
                      mention_percent_in_top:
                        type: integer
                        description: Percentage of prompts with brand mention in Top N (0–100).
                      mention_diff:
                        type: integer
                        description: Change in mention percentage from first to last date (percentage points).
                  aio_presence:
                    type: object
                    properties:
                      prompts_with_aio:
                        type: integer
                        description: Percentage of prompts that show AI Overview (0–100).
                      prompts_with_aio_diff:
                        type: integer
                        description: Change in `prompts_with_aio` from first to last date (percentage points).
                  organic_overlap:
                    type: object
                    properties:
                      overlap_count:
                        type: integer
                        description: Number of overlapping URLs from the Top 20 organic and AIO.
                      overlap_count_diff:
                        type: integer
                        description: Change in overlap count from first to last date.
                      overlap_percent:
                        type: integer
                        description: Percentage of overlap (0–100).
                  sources_presence:
                    type: object
                    properties:
                      answers_with_sources:
                        type: integer
                        description: Percentage of answers that have source links (0–100).
                      answers_with_sources_diff:
                        type: integer
                        description: Change in `answers_with_sources` from first to last date (percentage points).
              examples:
                googleAIOverviewWithDateRangeAndTop3:
                  summary: Google AI Overview with date range and top=3
                  value:
                    llm_id: 151216
                    site_id: 11270054
                    top: 3
                    stats:
                      prompts_count: 5
                      last_update: "2026-02-19"
                      indexed_percent: 100
                    presence:
                      link_percent_in_top: 0
                      link_diff: 0
                      mention_percent_in_top: 0
                      mention_diff: 0
                    aio_presence:
                      prompts_with_aio: 80
                      prompts_with_aio_diff: 0
                    organic_overlap:
                      overlap_count: 4
                      overlap_count_diff: 0
                      overlap_percent: 20
                chatgptWithDateRangeAllPositions:
                  summary: ChatGPT with date range (all positions)
                  value:
                    llm_id: 151294
                    site_id: 11270054
                    top: 0
                    stats:
                      prompts_count: 5
                      last_update: "2026-02-19"
                      indexed_percent: 100
                    presence:
                      link_percent_in_top: 0
                      link_diff: 0
                      mention_percent_in_top: 20
                      mention_diff: 0
                    sources_presence:
                      answers_with_sources: 60
                      answers_with_sources_diff: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          $ref: "#/components/responses/PaymentRequired"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
