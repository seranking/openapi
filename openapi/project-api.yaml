  /v1/project-management/airt/prompts/groups:
    get:
      operationId: listPromptGroups
      tags:
        - AI Results Tracker – Prompt Groups
      summary: List prompt groups
      description: |-
        **Quick start**

        ```
        curl 'https://api.seranking.com/v1/project-management/airt/prompts/groups?site_id=11270054&keys_count=1' \
          -H 'Authorization: Token YOUR_API_KEY'
        ```

        Returns every prompt group for project `11270054`, ordered by `position`, with a `keys_count` on each group.

        The response is a **bare JSON array** (no `data` envelope).
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/airt-groups/#list-prompt-groups
      parameters:
        - name: site_id
          in: query
          required: true
          description: Project ID. From `GET /sites`.
          schema:
            type: integer
        - name: keys_count
          in: query
          description: >-
            `0` or `1`. When `1`, each group includes a `keys_count` field. Defaults to omitted (no `keys_count` in
            response).
          schema:
            type: string
        - name: site_llm_ids[]
          in: query
          description: >-
            Filter to groups that contain at least one prompt on these LLM engines. **Repeat the parameter:**
            `site_llm_ids[]=1&site_llm_ids[]=2`. Combined as OR (union).
          schema:
            type: array
            items:
              type: integer
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: >-
                        Numeric group ID, encoded as a string. Use as `group_id` in every other prompt-group / prompts
                        endpoint.
                    name:
                      type: string
                      description: Group name. Unique within the project (case-sensitive). Max 255 chars.
                    position:
                      type: string
                      description: Sort order within the project, ascending. **Not guaranteed to start at 0**.
                    is_default:
                      type: string
                      description: >-
                        `"1"` for the project’s undeleteable default group, `"0"` otherwise. Exactly one default per
                        project once AIRT has been initialized.
                    creation_date:
                      type: string
                      description: >-
                        `YYYY-MM-DD` (server timezone). The default group’s date equals the day AIRT was first opened on
                        the project, not the project’s creation date.
                    keys_count:
                      type: string
                      description: >-
                        Numeric prompt count, encoded as a string. **Present only when `keys_count=1` in the query.**
