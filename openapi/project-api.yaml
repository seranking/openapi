    post:
      operationId: createAudit
      tags:
        - Website Audit
      summary: Create audit / Add audit source pages
      description: >-
        ### Create audit


        Creates a website audit that crawls the HTML of a target site. Suitable for static and server-side-rendered
        sites. Enable `csr` in `settings` for JavaScript-rendered pages.


        **Note:** Page crawl limit depends on your subscription plan.


        If successful, the server returns a JSON object containing the unique ID for the newly created audit.


        ### Add audit source pages


        Uploads a custom list of URLs to crawl. The list is submitted as a multipart text file with one URL per line.
        Auto-sets `settings.source_file` to `1`.
      externalDocs:
        description: Documentation
        url: https://seranking.com/api/project/audit/#create-audit
